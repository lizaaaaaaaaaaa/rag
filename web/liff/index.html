<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting…</title>
  <noscript><meta http-equiv="refresh" content="0; url=/liff/consent"></noscript>
  <style>body{font-family:system-ui,sans-serif;padding:24px}</style>
</head>
<body>
  <p>Redirecting to consent…</p>
  <script>
    // liff.state を引き継いで /liff/consent へ
    (function(){
      const all = new URLSearchParams(location.search);
      const stateQS = new URLSearchParams(all.get("liff.state") || "");
      const qs = new URLSearchParams();
      ["state","ab","utm_campaign"].forEach(k=>{
        const v = stateQS.get(k) || all.get(k);
        if(v) qs.set(k, v);
      });
      const to = "/liff/consent" + (qs.toString() ? ("?"+qs.toString()) : "");
      location.replace(to);
    })();
  </script>
</body>
</html>
