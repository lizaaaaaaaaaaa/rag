<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LINEで相談をはじめる</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;line-height:1.7;margin:0;background:#f0f4f6}
    .wrap{max-width:560px;margin:48px auto;padding:24px;background:#fff;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
    h1{font-size:1.35rem;margin:0 0 8px}
    p{margin:.2rem 0 1rem;color:#555}
    .btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;font-weight:700}
    .primary{background:#06c755;color:#fff}
    .mute{background:#eef7f0;color:#0a6d33;margin-top:10px}
    .id{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>LINEで相談をはじめる</h1>
    <p>まずは公式LINEを友だち追加してください。</p>

    <!-- ★ ここだけ差し替え（@を付けない） -->
    <script>const LINE_BASIC_ID = "yourbasicid";</script>

    <button id="addBtn" class="btn primary">友だち追加</button>
    <button id="openWebBtn" class="btn mute">ブラウザで開く</button>
    <p>アカウント：<span class="id">@<span id="basicId"></span></span></p>
  </div>

  <script>
    const $ = s=>document.querySelector(s);
    $('#basicId').textContent = LINE_BASIC_ID;

    const addInApp = `line://ti/p/@${LINE_BASIC_ID}`;
    const addOnWeb = `https://line.me/R/ti/p/%40${LINE_BASIC_ID}`;

    async function openAdd(){
      try{
        await liff.init({ liffId: "dummy" }).catch(()=>{});
        if (typeof liff !== 'undefined' && liff.isInClient()){
          await liff.openWindow({ url: addInApp, external: false });
          return;
        }
      }catch(_){}
      location.href = addOnWeb;
    }

    $('#addBtn').addEventListener('click', openAdd);
    $('#openWebBtn').addEventListener('click', ()=>location.href = addOnWeb);
  </script>
</body>
</html>
