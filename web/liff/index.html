<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI相談をはじめる</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", Helvetica, Arial; line-height:1.6; padding:24px;}
    .links a{margin-right:12px}
    .consent-box{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0;max-width:560px}
    .consent-box h3{margin:0 0 8px 0;font-size:1.1rem}
    .checks label{display:flex;gap:8px;margin:6px 0}
    button[disabled]{opacity:.5;cursor:not-allowed}
    .ok{background:#10b981;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:1rem}
    .notice{color:#666;font-size:.9rem}
  </style>
</head>
<body>
  <h1>AI相談をはじめる</h1>
  <p class="notice">ご利用前に以下をご確認ください。</p>
  <p class="links">
    <a href="/privacy" target="_blank">プライバシーポリシー</a>
    <a href="/terms" target="_blank">利用規約</a>
    <a href="/cookie" target="_blank">Cookie・外部送信</a>
  </p>

  <div class="consent-box" id="consentBox">
    <h3>ご利用前に同意が必要です</h3>
    <p class="notice">以下の5項目すべてにチェックのうえ「同意して開始」を押してください。</p>
    <div class="checks">
      <label><input type="checkbox" name="c" value="pp">プライバシーポリシーに同意します</label>
      <label><input type="checkbox" name="c" value="tos">利用規約に同意します</label>
      <label><input type="checkbox" name="c" value="cookie">Cookie・外部送信に同意します</label>
      <label><input type="checkbox" name="c" value="xfer">入力内容が外部送信される可能性を理解しました</label>
      <label><input type="checkbox" name="c" value="ai_limits">AIの誤答可能性を理解しました</label>
    </div>
    <div style="margin-top:12px">
      <button class="ok" id="beginBtn" disabled>同意して開始</button>
    </div>
  </div>

  <p class="notice" id="status">initializing…</p>

  <script>
    // ===== 設定 =====
    const LIFF_ID = "<あなたのLIFF ID>";           // ←差し替え
    const POLICY_VERSION = "2025-09-01";
    const TOS_VERSION    = "2025-09-01";
    const CHAT_REDIRECT  = "/liff/consent?next=chat"; // 保存後に遷移（既存のconsent.html/チャット導線に合わせてOK）
    // =================

    const $ = (s)=>document.querySelector(s);

    const allChecked = () => {
      const boxes = document.querySelectorAll('input[name="c"]');
      return Array.from(boxes).every(b => b.checked);
    };

    const collectFlags = () => {
      const f = {pp:false,tos:false,cookie:false,xfer:false,ai_limits:false};
      document.querySelectorAll('input[name="c"]').forEach(b=>{ f[b.value]=b.checked; });
      return f;
    };

    const saveConsent = async (userId, flags) => {
      const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
      const body = {
        consent_id: crypto.randomUUID(),
        user_id: userId,
        consented_at: now,
        policy_version: POLICY_VERSION,
        tos_version: TOS_VERSION,
        flags,
        source: "line-liff"
      };
      const res = await fetch("/consent/save", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error("consent/save failed");
      return res.json();
    };

    const afterSaved = () => {
      // 既存の導線に合わせて：consent.html 経由 or そのままチャットへ
      location.href = CHAT_REDIRECT;
    };

    const initPage = async () => {
      // 5チェック監視
      document.querySelectorAll('input[name="c"]').forEach(b=>{
        b.addEventListener('change', ()=> { $('#beginBtn').disabled = !allChecked(); });
      });

      // ボタンクリック → ログイン → 保存
      $('#beginBtn').addEventListener('click', async ()=>{
        try {
          const flags = collectFlags();
          localStorage.setItem("pref_flags", JSON.stringify(flags));

          if (!liff.isLoggedIn()) {
            // ログイン後に戻ってくる
            liff.login({ redirectUri: location.href });
            return;
          }

          $('#status').textContent = "保存しています…";
          const profile = await liff.getProfile();
          await saveConsent(profile.userId, flags);
          afterSaved();
        } catch(e){
          console.error(e);
          alert("保存に失敗しました。時間を置いてお試しください。");
        }
      });

      // LIFF 初期化
      await liff.init({ liffId: LIFF_ID });
      $('#status').textContent = liff.isLoggedIn() ? "ログイン済みです" : "ログインが必要です";

      // ログイン直後に戻ってきた場合：保存を自動継続
      if (liff.isLoggedIn()) {
        const json = localStorage.getItem("pref_flags");
        if (json) {
          try {
            const flags = JSON.parse(json);
            // 画面側にも反映しておく（任意）
            Object.entries(flags).forEach(([k,v])=>{
              const box = document.querySelector(`input[value="${k}"]`);
              if (box) box.checked = !!v;
            });
            $('#beginBtn').disabled = !allChecked();
          } catch {}
        }
      }
    };

    initPage().catch(e=>{
      console.error(e);
      $('#status').textContent = "初期化に失敗しました";
    });
  </script>
</body>
</html>
