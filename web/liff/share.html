<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>友だちに紹介</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; padding: 16px; }
    .hint { font-size: 14px; color: #666; }
  </style>
</head>
<body>
<script>
(async () => {
  // ─────────────────────────────────────────────────────────────
  // 1) ここをあなたの「友だちに紹介」LIFF ID に差し替えてください
  //    例: const EMBEDDED_LIFF_ID = "2007887876-OjNbylba";
  // ─────────────────────────────────────────────────────────────
  const EMBEDDED_LIFF_ID = "2007887876-OjNbylba";

  // URLクエリがあれば優先（例: ?liff_id=...&url=https%3A%2F%2Fai.example.com%2F）
  const p = new URLSearchParams(location.search);
  const qLiffId = p.get("liff_id");
  const shareUrl = decodeURIComponent(p.get("url") || "https://ai.kinoedesign.co.jp/");

  // 優先順: クエリliff_id → 埋め込みID
  const LIFF_ID = qLiffId || EMBEDDED_LIFF_ID;

  if (!LIFF_ID || LIFF_ID === "PUT_YOUR_LIFF_ID_HERE") {
    alert("設定エラー: LIFF ID が未設定です。share.html 内の EMBEDDED_LIFF_ID を差し替えてください。");
    throw new Error("Missing LIFF_ID");
  }

  try {
    await liff.init({ liffId: LIFF_ID });

    // 外部ブラウザ対策（LIFF内で未ログインならログイン）
    if (!liff.isLoggedIn()) {
      await liff.login({ redirectUri: location.href });
      return; // ログイン後に戻ってきます
    }

    // 共有
    if (liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([
        { type: "text", text: `🏡 キノエデザインのAI相談はこちら → ${shareUrl}` }
      ]);
    } else {
      // 一部端末は shareTargetPicker が使えないためフォールバック
      alert("この端末/環境では共有が利用できません。リンクをコピーして共有してください。\n" + shareUrl);
    }
  } catch (e) {
    console.error(e);
    alert("共有に失敗しました。時間をおいてお試しください。");
  } finally {
    try { liff.closeWindow(); } catch (_) {}
  }
})();
</script>

<p class="hint">※このページはLIFF経由で自動的に共有画面を開きます。</p>
</body>
</html>
