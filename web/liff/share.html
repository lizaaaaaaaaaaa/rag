<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>友だちに紹介</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light only; }
    body{font-family:-apple-system,system-ui,"Noto Sans JP",sans-serif;background:#f5f6f7;margin:0}
    .wrap{max-width:640px;margin:0 auto;padding:20px}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px}
    h1{font-size:20px;margin:6px 0 2px}
    p{line-height:1.7;margin:10px 0}
    .muted{color:#666;font-size:13px}
    .btn{display:inline-block;background:#06c755;color:#fff;text-align:center;font-weight:600;
         border-radius:10px;padding:12px 18px;text-decoration:none}
    .btn-sub{display:inline-block;background:#e8f5ea;color:#066b2f;border-radius:10px;
         padding:10px 14px;text-decoration:none;margin-top:10px}
    .link{word-break:break-all;color:#666;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>友だちに紹介</h1>
    <p class="muted">このページはLINEアプリ内で自動的に共有画面を開きます。</p>
    <p id="msg" class="muted"></p>
    <p><a id="openLine" class="btn" href="#" target="_self">LINEで紹介する</a></p>
    <p><a id="nativeShare" class="btn-sub" href="#" target="_self">端末の共有メニューで送る</a></p>
    <p class="link" id="fallbackLink"></p>
  </div>
</div>

<script>
(async () => {
  // ======= 既定値（君の環境に合わせ済み） =======
  const DEFAULT_LIFF_ID   = "2007887876-OjNbylba";           // ← LIFF_ID_SHARE
  const DEFAULT_SHARE_URL = "https://ai.kinoedesign.co.jp/"; // 共有したいURL

  // クエリ優先（?liff_id=...&url=...）
  const qp = new URLSearchParams(location.search);
  const LIFF_ID   = qp.get("liff_id") || DEFAULT_LIFF_ID;
  const TARGET_URL = decodeURIComponent(qp.get("url") || DEFAULT_SHARE_URL);

  // 便利リンク
  const liffDeepLink   = `https://liff.line.me/${encodeURIComponent(LIFF_ID)}?url=${encodeURIComponent(TARGET_URL)}`;
  const universalShare = `https://line.me/R/msg/text/?${encodeURIComponent(TARGET_URL)}`;

  // UI
  const msg          = document.getElementById("msg");
  const btnOpenLine  = document.getElementById("openLine");
  const btnNative    = document.getElementById("nativeShare");
  const fallbackLink = document.getElementById("fallbackLink");

  // ボタンは常時有効
  btnOpenLine.href = liffDeepLink;
  btnNative.addEventListener("click", async (e) => {
    e.preventDefault();
    if (navigator.share) {
      try {
        await navigator.share({ title: "AI相談のご紹介", url: TARGET_URL });
        return;
      } catch (_) {} // キャンセル時などは無視
    }
    // Web Share 非対応 → LINEユニバーサルリンクへ
    location.href = universalShare;
  });

  // ① 外部ブラウザ（LINEアプリ外）なら、LINEを強制起動（スマホのみ）
  const ua = navigator.userAgent || "";
  const isLine   = /Line/i.test(ua);
  const isMobile = /iPhone|Android/i.test(ua);
  if (!isLine && isMobile) {
    msg.textContent = "LINEアプリで開いています…";
    location.replace(liffDeepLink);
    return;
  }

  // ② LINE内：LIFF初期化 → 共有APIが使えれば即起動
  try {
    await liff.init({ liffId: LIFF_ID });

    // API可なら shareTargetPicker を即起動
    if (liff.isInClient() && liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([
        { type: "text", text: "AI相談のご紹介です👇\n" + TARGET_URL }
        // 必要なら FlexMessage に差し替え可能
      ]);
      try { liff.closeWindow(); } catch(_) {}
      return;
    }

    // ③ LINE内だが共有APIが使えない → ユーザー操作で共有
    msg.textContent = "お使いの環境では共有APIが使えません。次のボタンから共有してください。";
    fallbackLink.textContent = TARGET_URL;

  } catch (e) {
    // ④ LIFF初期化失敗 → 端末の共有 or LINEユニバーサルリンクへ
    console.error(e);
    msg.textContent = "共有の自動起動に失敗しました。次のボタンから共有してください。";
    fallbackLink.textContent = TARGET_URL;
  }
})();
</script>
</body>
</html>
