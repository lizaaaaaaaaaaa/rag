<!-- /web/liff/share.html まるごと置き換え -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <title>友だちに紹介</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --gap: 16px;
      --radius: 14px;
      --green: #06c755;   /* LINEっぽい緑 */
      --soft: #eef6ef;
      --shadow: 0 6px 20px rgba(0,0,0,.08);
      --maxw: 680px;      /* 大端末でも横伸びしすぎないように */
    }
    html, body {
      margin: 0; padding: 0;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "游ゴシック Medium", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
      color: #111;
    }
    .wrap {
      box-sizing: border-box;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px);
      max-width: var(--maxw);
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
    }
    .desc {
      margin: 0 0 16px;
      color: #444;
      font-size: 14px;
      line-height: 1.6;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      margin-top: 10px;
    }
    @media (min-width: 480px) {
      .btns { grid-template-columns: 1fr; }
    }

    .btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius);
      padding: 16px 18px;   /* 指で押しやすい高さ */
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .06s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: translateY(1px) scale(.995); }

    .btn-line {
      background: var(--green);
      color: #fff;
    }
    .btn-plain {
      background: var(--soft);
      color: #102a12;
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      text-align: left;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>友だちに紹介</h1>
      <p class="desc">
        このページはLINEアプリ内なら共有画面を自動で開きます。<br />
        うまく開かない場合は、下のボタンから共有してください。
      </p>

      <div class="btns">
        <button id="btnLine" class="btn btn-line">LINEで紹介する</button>
        <button id="btnSystem" class="btn btn-plain">端末の共有メニューで送る</button>
      </div>

      <!-- ※生URL表示は廃止 -->
      <div id="hint" class="hint"></div>
    </div>
  </div>

  <script>
    // ===== 受け取りパラメータ =====
    const p = new URLSearchParams(location.search);
    const shareUrl   = decodeURIComponent(p.get("url")   || "https://ai.kinoedesign.co.jp/");
    const shareTitle = decodeURIComponent(p.get("title") || "AI相談のご紹介");
    const shareText  = decodeURIComponent(p.get("text")  || "キノエデザイン住まいAIプランナーの公式LINEです。");

    const hint = document.getElementById("hint");
    const setHint = (t) => { hint.textContent = t || ""; };

    // ===== 共有ペイロードを共通化 =====
    function buildShareItems() {
      const textBlock = `${shareTitle}\n${shareText}\n${shareUrl}`;
      return [{
        type: "text",
        text: textBlock,
      }];
    }

    // ===== 端末の共有メニュー =====
    async function systemShare() {
      const textBlock = `${shareTitle}\n${shareText}\n${shareUrl}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: shareTitle, text: textBlock, url: shareUrl });
        } catch (_) {}
      } else {
        // フォールバック：URLをコピー
        try {
          await navigator.clipboard.writeText(textBlock);
          alert("共有テキストをクリップボードにコピーしました。お好きなアプリで貼り付けてください。");
        } catch (_) {
          location.href = shareUrl;
        }
      }
    }

    // ===== LIFF共有 =====
    async function shareViaLINE() {
      try {
        if (!liff.isLoggedIn()) await liff.login();
        if (liff.isApiAvailable("shareTargetPicker")) {
          const res = await liff.shareTargetPicker(buildShareItems());
          if (!res) {
            // ユーザーがキャンセルなど
            setHint("共有はキャンセルされました。再度お試しください。");
          }
        } else {
          // API非対応（ブラウザ内など） → LINEアプリで開く
          liff.openWindow({
            url: "line://msg/text/" + encodeURIComponent(`${shareTitle}\n${shareText}\n${shareUrl}`),
            external: false
          });
        }
      } catch (e) {
        // 何か起きたら端末メニューへフォールバック
        systemShare();
      }
    }

    // ===== 起動 =====
    const LIFF_ID = (new URLSearchParams(location.search)).get("liffId") || ""; // 使わないが将来の拡張用

    (async () => {
      try {
        await liff.init({ liffId: "{{LIFF_ID_SHARE_PLACEHOLDER}}" }); // ★ビルド時に差替え（バック側で置換しているならそのままでOK）
        // LIFF内なら自動で共有を試みる
        if (liff.isInClient()) {
          shareViaLINE();
          setHint("共有画面を開いています…");
        }
      } catch (_) {
        // 失敗しても画面は使える（手動ボタンあり）
      }
    })();

    // イベント
    document.getElementById("btnLine").addEventListener("click", shareViaLINE);
    document.getElementById("btnSystem").addEventListener("click", systemShare);
  </script>
</body>
</html>
