<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>友だちに紹介</title>
  <!-- 固定バージョン（要件通り） -->
  <script src="https://static.line-scdn.net/liff/edge/versions/2.23.1/sdk.js"></script>
  <style>
    :root { --green:#06C755; --muted:#E8F5EE; --text:#222; }
    html,body{margin:0;padding:0;background:#fafafa;color:var(--text);}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;}
    .wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);}
    .card{background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.06);padding:20px;}
    h1{font-size:22px;margin:0 0 12px;font-weight:800;}
    p{margin:10px 0 18px;line-height:1.7;color:#555;}
    .btn{display:block;width:100%;border:none;border-radius:12px;padding:16px 18px;
         font-size:18px;font-weight:700;letter-spacing:.02em;cursor:pointer;
         transition:.15s transform ease,.15s opacity ease;box-shadow:0 6px 18px rgba(0,0,0,.06);}
    .btn:active{transform:scale(.98);opacity:.9;}
    .btn-line{background:var(--green);color:#fff;margin-bottom:12px;}
    .btn-share{background:var(--muted);color:#134d31;}
    .hint{margin-top:10px;font-size:13px;color:#777;}
    .hidden{display:none!important;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>友だちに紹介</h1>
      <p>このページは <b>LINE アプリ内</b> なら共有画面を自動で開きます。うまく開かないときは下のボタンを使ってください。</p>

      <button id="btnLine"   class="btn btn-line">LINEで紹介する</button>
      <button id="btnNative" class="btn btn-share">端末の共有メニューで送る</button>

      <p id="note" class="hint hidden">共有先の選択画面が開かない場合は、右上の×で閉じてからもう一度お試しください。</p>
    </div>
  </div>

  <script>
    // ===== 設定/入力パラメータ =====
    // invite が無いときの最終フォールバック先（サイトURL）
    const DEFAULT_SITE_URL = "https://lin.ee/tXUD9eu";

    const qs     = new URLSearchParams(location.search);
    const liffId = qs.get("liffId") || qs.get("liffid") || "";        // LIFF ID（クエリ優先）
    const invite = qs.get("invite");                                   // 公式LINE招待URL（例: https://lin.ee/xxxxx）
    const site   = qs.get("url") || DEFAULT_SITE_URL;                  // サイトURL（フォールバック用）
    const title  = qs.get("title") || "AI相談のご紹介";
    const desc   = qs.get("desc")  || "キノエデザイン住まいAIプランナーの公式LINEです。";

    // 共有URLは invite 最優先 → なければ site
    const SHARE_URL  = invite || site;
    const SHARE_TEXT = `${title}\n${desc}\n${SHARE_URL}`;

    const $btnLine   = document.getElementById("btnLine");
    const $btnNative = document.getElementById("btnNative");
    const $note      = document.getElementById("note");

    // ===== 非 in-client 用：LINE汎用シェアURLへフォールバック =====
    function openLineShareUrl() {
      location.href = `https://line.me/R/share?text=${encodeURIComponent(SHARE_TEXT)}`;
    }

    // 端末ネイティブ共有（任意の第2手段）
    async function nativeShare() {
      if (navigator.share) {
        try {
          await navigator.share({ title, text: `${desc}\n${SHARE_URL}`, url: SHARE_URL });
          return;
        } catch (_) { /* キャンセル等は無視して何もしない */ }
      }
      // Web Share API 非対応の場合は LINE汎用シェアURLで確実に遷移
      openLineShareUrl();
    }

    // ===== in-client：shareTargetPicker のみを使用（login/redirect はしない） =====
    async function shareInLINE() {
      try {
        if (!liff.isApiAvailable('shareTargetPicker')) {
          // 稀にAPI非対応や不安定端末 → 確実に共有手段を提供
          return openLineShareUrl();
        }
        const messages = [{ type: "text", text: SHARE_TEXT }]; // テキストのみ（確実＆安定）
        await liff.shareTargetPicker(messages);
      } catch (_) {
        openLineShareUrl();
      }
    }

    // ===== 初期化・自動起動 =====
    (async () => {
      let inClient = false;

      // 要件：in-client のみ LIFF API を使う（login/redirect は行わない）
      if (liffId) {
        try {
          await liff.init({ liffId });  // ← liff.login() は呼ばない
          inClient = liff.isInClient();
        } catch (_) {
          inClient = false;
        }
      }

      // in-client なら自動で共有先選択を開く
      if (inClient) {
        $note.classList.remove("hidden");
        shareInLINE();
      }

      // ボタン動作
      $btnLine.addEventListener("click", () => (inClient ? shareInLINE() : openLineShareUrl()));
      $btnNative.addEventListener("click", nativeShare);
    })();
  </script>
</body>
</html>
