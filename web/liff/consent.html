<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI相談のご利用前の同意</title>
  <style>
    body { font-family: -apple-system, system-ui, "Noto Sans JP", sans-serif; padding: 18px; }
    h1 { font-size: 22px; margin: 8px 0 16px; }
    label { display: flex; gap: 10px; align-items: baseline; margin: 10px 0; line-height: 1.7; }
    button { margin-top: 18px; font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #ddd; background:#06c755; color:#fff; }
    a { color: #0366d6; text-decoration: underline; }
    small { color:#666; }
    .links { margin: 10px 0 16px; }
  </style>
</head>
<body>
  <h1>AI相談のご利用前の同意</h1>
  <p>以下をご確認のうえ、チェックを入れて「同意して開始」を押してください。</p>

  <div class="links">
    <div>・プライバシーポリシー：
      <a href="https://preview.studio.site/live/EjOQljz1WJ/privacy-policy" target="_blank" rel="noopener">こちら</a>
    </div>
    <div>・利用規約：
      <a href="https://preview.studio.site/live/EjOQljz1WJ/termsofuse/service" target="_blank" rel="noopener">こちら</a>
    </div>
    <div>・Cookie（外部送信）：
      <a href="https://preview.studio.site/live/EjOQljz1WJ/cookie" target="_blank" rel="noopener">こちら</a>
    </div>
  </div>

  <label><input type="checkbox" id="ck1" checked> プライバシーポリシーに同意する</label>
  <label><input type="checkbox" id="ck2" checked> 利用規約に同意する</label>
  <label><input type="checkbox" id="ck3" checked> Cookie（外部送信）に同意する</label>
  <label><input type="checkbox" id="ck4" checked> 入力内容が外部送信される可能性を理解しました</label>
  <label><input type="checkbox" id="ck5" checked> AIの誤答の可能性を理解しました</label>

  <button id="go">同意して開始</button>
  <p><small>※ 同意はLINE内のAI相談にのみ適用されます</small></p>

  <script>
    // ===== 設定値 =====
    const BASIC_ID = (new URLSearchParams(location.search).get("basic_id") || "").replace(/^@/, "") || "{{BASIC_ID}}";
    // サーバから env で埋め込まない場合は、上の "{{BASIC_ID}}" は無視され、LINE_BASIC_ID 環境変数で動作します（バックエンド側で置換不要）。

    function getParam(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function openLineChatWithAI() {
      // 公式アカウントへ戻って「AI相談」を自動送信
      const ai = encodeURIComponent("AI相談");
      const oa = BASIC_ID ? BASIC_ID : ""; // 無ければ後方互換の add へ
      if (oa) {
        location.href = `https://line.me/R/oaMessage/${oa}/${ai}`;
        // 念のためフォールバック（友だち追加）
        setTimeout(() => { location.replace(`https://line.me/R/ti/p/%40${oa}`); }, 1800);
      } else {
        // BASIC_ID が取れないケースはそのまま閉じる
        history.back();
      }
    }

    async function saveConsent() {
      const userToken = getParam("user_token");
      if(!userToken){
        alert("無効なアクセスです（user_token 不足）");
        return;
      }
      // 必須チェック
      const all = ["ck1","ck2","ck3","ck4","ck5"].every(id => document.getElementById(id).checked);
      if(!all){
        alert("すべてにチェックを入れてください。");
        return;
      }
      const btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "保存中…";
      const body = {
        agree_privacy: true,
        agree_tos: true,
        agree_cookie: true,
        understand_external_send: true,
        understand_ai_may_be_wrong: true,
        meta: {
          state: getParam("state") || "",
          ab: getParam("ab") || "",
          utm_source: getParam("utm_source") || "",
          utm_medium: getParam("utm_medium") || "",
          utm_campaign: getParam("utm_campaign") || "",
          utm_content: getParam("utm_content") || ""
        }
      };
      try{
        const qs = new URLSearchParams({ user_token: userToken }).toString();
        const res = await fetch(`/consent/save?${qs}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-Token": userToken
          },
          body: JSON.stringify(body),
          credentials: "omit"
        });
        if(!res.ok){ throw new Error("save failed"); }
        // 保存成功 → LINEへ戻ってAI相談
        openLineChatWithAI();
      }catch(e){
        alert("保存に失敗しました。時間をおいて再度お試しください。");
        btn.disabled = false; btn.textContent = "同意して開始";
      }
    }
    document.getElementById("go").addEventListener("click", saveConsent);
  </script>
</body>
</html>
