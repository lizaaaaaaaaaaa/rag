<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI相談のご利用前の同意</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,Roboto,'Hiragino Sans',Meiryo,sans-serif;margin:0;background:#f6f7f9}
    .wrap{max-width:560px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
    h1{font-size:1.2rem;margin:0 0 12px}
    .small{color:#666}
    .btn{padding:.7rem 1rem;border:1px solid #ddd;border-radius:.7rem;background:#10b981;color:#fff;cursor:pointer}
    .chk{margin:.25rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ご利用前の同意</h1>
    <p class="small">以下をご確認のうえ、チェックを入れて「同意して開始」を押してください。</p>

    <label class="chk"><input type="checkbox" id="c1"> プライバシーポリシーに同意します</label><br>
    <label class="chk"><input type="checkbox" id="c2"> 利用規約に同意します</label><br>
    <label class="chk"><input type="checkbox" id="c3"> AIの回答は必ずしも正確でないことを理解しました</label><br><br>

    <button id="agree" class="btn">同意して開始</button>
    <p class="small" id="msg"></p>
  </div>

  <script>
    // ===== 設定 =====
    // なくても動きますが、同意後に自動で「AI相談」を送信して LIFF を閉じるために設定推奨
    const LIFF_ID = "YOUR_CONSENT_LIFF_ID";
    // consent_gate 側のスコープ名
    const SCOPE   = "ai_line";

    // Bot から渡される個別リンクのクエリ。例）/liff/consent?user_token=Uxxxxxxxxxxxxx
    const token = new URL(location.href).searchParams.get("user_token") || "";

    // DOM ユーティリティ
    const $ = (s) => document.querySelector(s);
    const note = (t) => { $("#msg").textContent = t };

    // 共通 POST
    async function postJSON(url, body){
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(token && {"user_token": token}) },
        body: JSON.stringify(body)
      });
    }

    // すでに同意済みなら即終了
    async function initialCheck(){
      if(!token){ note("リンクが無効です。公式LINEのメッセージから開き直してください。"); return false; }
      try{
        const r = await postJSON("/consent/check", { scope: SCOPE });
        const j = await r.json().catch(()=> ({}));
        if(j && (j.valid || j.is_valid)){ await afterAgree(); return true; }
      }catch(e){}
      return false;
    }

    // 同意後の処理（可能なら AI相談 を自動送信→ウィンドウを閉じる）
    async function afterAgree(){
      try{
        try{
          if(LIFF_ID){ await liff.init({ liffId: LIFF_ID }); }
          if(typeof liff.sendMessages === "function"){
            await liff.sendMessages([{ type:"text", text:"AI相談" }]);
          }
        }catch(e){}
        try{ liff.closeWindow && liff.closeWindow(); }
        catch(e){ note("同意しました。トーク画面に戻って「AI相談」を押してください。"); }
      }catch(e){}
    }

    // 「同意して開始」
    $("#agree").addEventListener("click", async ()=>{
      if(!($("#c1").checked && $("#c2").checked && $("#c3").checked)){
        note("すべてにチェックを入れてください。");
        return;
      }
      if(!token){ note("リンクが無効です。"); return; }

      note("送信中…");
      try{
        const res = await postJSON("/consent/save", {
          // consent_gate のモデルに合わせたペイロード
          consent_id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          user_id: token,                   // ← Headerの user_token でも認識されますが、冗長に body にも入れておきます
          liff_id: LIFF_ID || null,
          consented_at: new Date().toISOString(),
          policy_version: "latest",
          tos_version: "latest",
          flags: { pp:true, tos:true, cookie:true, ai_limits:true, xfer:true },
          locale: navigator.language || "ja",
          source: "line_liff_consent"
        });
        if(res.ok){ await afterAgree(); }
        else { note("保存に失敗しました。時間をおいてお試しください。"); }
      }catch(e){
        note("通信エラーです。電波状況をご確認ください。");
      }
    });

    // 起動時に同意済みチェック
    initialCheck();
  </script>
</body>
</html>
