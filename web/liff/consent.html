<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>公式LINE 友だち追加</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;line-height:1.7;margin:0;background:#f6f7f9}
    .wrap{max-width:560px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
    h1{font-size:1.35rem;margin:0 0 6px}
    p.note{color:#666;margin:.2rem 0 1rem}
    .btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;font-weight:700}
    .primary{background:#06c755;color:#fff}
    .ghost{background:#eef7f0;color:#0a6d33;margin-top:10px}
    .tips{font-size:.9rem;color:#666;margin-top:14px}
    .id{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>公式LINE を友だち追加</h1>
    <p class="note">ボタンを押すと公式アカウントの追加画面を開きます。</p>

    <!-- ★ ここだけ差し替え（@を付けない） -->
    <script>const LINE_BASIC_ID = "yourbasicid";</script>

    <button id="addBtn" class="btn primary">LINEアプリで友だち追加</button>
    <button id="addWebBtn" class="btn ghost">ブラウザで友だち追加</button>

    <p class="tips">※ 追加済みの方は、そのままトーク画面からご相談いただけます。<br>
      公式アカウント：<span class="id">@<span id="basicId"></span></span></p>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const addInApp = `line://ti/p/@${LINE_BASIC_ID}`;
    const addOnWeb = `https://line.me/R/ti/p/%40${LINE_BASIC_ID}`;

    $('#basicId').textContent = LINE_BASIC_ID;

    async function openInApp(){
      try{
        if (typeof liff !== 'undefined') {
          await liff.init({ liffId: "dummy-for-open" }).catch(()=>{});
          if (liff.isInClient()){
            await liff.openWindow({ url: addInApp, external: false });
            return;
          }
        }
      }catch(_){}
      // フォールバック（外部ブラウザなど）
      location.href = addOnWeb;
    }

    $('#addBtn').addEventListener('click', openInApp);
    $('#addWebBtn').addEventListener('click', ()=>location.href = addOnWeb);
  </script>
</body>
</html>
