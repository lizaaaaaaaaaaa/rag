<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI相談のご利用前の同意</title>
  <style>
    body{font-family:-apple-system,system-ui,"Noto Sans JP",sans-serif;padding:18px}
    h1{font-size:22px;margin:8px 0 16px}
    p,li,label{line-height:1.7}
    .links{margin:10px 0 16px}
    .links a{color:#0366d6;text-decoration:underline}
    label{display:flex;gap:10px;align-items:baseline;margin:10px 0}
    input[type="checkbox"]{transform:scale(1.1);margin-top:2px}
    button{margin-top:18px;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #ddd;background:#06c755;color:#fff}
    button[disabled]{opacity:.5}
    small{color:#666}
    #dbg{margin-top:12px;display:none}
  </style>
  <!-- LIFF SDK（userId取得/クライアント内判定に使用） -->
  <script src="https://static.line-scdn.net/liff/edge/versions/2.21.3/sdk.js"></script>
</head>
<body>
  <h1>AI相談のご利用前の同意</h1>
  <p>以下をご確認のうえ、チェックを入れて「同意して開始」を押してください。</p>

  <!-- 法務リンク（/legal 配信に統一） -->
  <div class="links" aria-label="関連ポリシー・規約へのリンク">
    <div>・プライバシーポリシー：<a href="/legal/privacy" target="_blank" rel="noopener">こちら</a></div>
    <div>・利用規約：<a href="/legal/terms"   target="_blank" rel="noopener">こちら</a></div>
    <div>・Cookie（外部送信の詳細）：<a href="/legal/cookie" target="_blank" rel="noopener">こちら</a></div>
  </div>

  <!-- ✅ 必須3チェック（PP / 外部送信 / AI限界） -->
  <label><input type="checkbox" id="chk_pp" aria-describedby="desc_pp">プライバシーポリシー（上記リンク）に同意します</label>
  <label><input type="checkbox" id="chk_xfer" aria-describedby="desc_xfer">入力内容が外部サービスへ送信される場合があることを理解しました</label>
  <label><input type="checkbox" id="chk_ai_limits" aria-describedby="desc_ai">AIの誤答・限界があることを理解しました</label>

  <!-- ◇ 任意（Cookie同意は任意扱い） -->
  <label><input type="checkbox" id="chk_cookie">Cookie等の利用（計測を含む）に同意します（任意）</label>

  <button id="btn-consent" disabled>同意して開始</button>
  <p><small>※ 同意は公式LINE内の「AI相談」にのみ適用されます。</small></p>

  <!-- 開発用：show_uid=1 の時だけ表示 -->
  <div id="dbg">
    <button id="show-uid">ユーザーIDを表示（開発用）</button>
  </div>

  <script>
    // ===== ユーティリティ =====
    const qs = new URLSearchParams(location.search);
    const getParam = (k, d="") => qs.get(k) || d;

    // LINE Basic ID：テンプレ置換（liff_pages.py が __LINE_BASIC_ID__ を @付きで埋め込み）
    const BASIC = (getParam("basic_id") || "__LINE_BASIC_ID__").replace(/^@?/, "@").replace(/^@@/, "@");
    const POLICY_VERSION = getParam("policy_version") || (window.__POLICY_VERSION__ || "1.0.0");
    const USER_TOKEN = getParam("user_token") || "";

    // LIFF 関連
    const LIFF_ID = "2007887876-vMNe74eX";
    let LINE_USER_ID = ""; // 取得できたら格納

    // 必須3チェックONでボタン活性
    const btn = document.getElementById('btn-consent');
    function updateButton(){
      const ok = document.getElementById('chk_pp').checked
              && document.getElementById('chk_xfer').checked
              && document.getElementById('chk_ai_limits').checked;
      btn.disabled = !ok;
    }
    ['chk_pp','chk_xfer','chk_ai_limits','chk_cookie'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('change', updateButton, {passive:true});
    });
    updateButton();

    // Deep Link 生成（友だちなら即トーク、未追加なら追加導線）
    function openLineChatWithAI(){
      const msg = encodeURIComponent("AI相談"); // リッチメニュー文言は変更しない
      const oa  = BASIC.replace(/^@/, "");      // oaMessage は @を付けない形式
      if(oa){
        location.href = `https://line.me/R/oaMessage/${oa}/?${msg}`;
        // 友だち未追加・アプリ未起動のフォールバック
        setTimeout(()=>{ location.replace(`https://line.me/R/ti/p/%40${oa}`); }, 1500);
      }else{
        history.back();
      }
    }

    // ===== LIFF 初期化（可能なら userId を取得してヘッダーに乗せる） =====
    (async () => {
      try{
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          // Web(LIFF外)で開かれた場合もあるので、リダイレクトを最小化
          liff.login({ redirectUri: location.href });
          return; // ログイン後に戻ってくる
        }
        // プロフィールから userId 取得（scope: profile が必要）
        const p = await liff.getProfile().catch(()=>null);
        if(p && p.userId) LINE_USER_ID = p.userId;

        // show_uid=1 のときだけ開発ボタンを表示
        if(qs.get("show_uid") === "1"){
          const dbg = document.getElementById('dbg');
          dbg.style.display = "block";
          document.getElementById('show-uid').onclick = () => {
            alert(LINE_USER_ID ? `userId: ${LINE_USER_ID}` : "userIdが取得できませんでした。scope=profile を確認してください。");
          };
        }
      }catch(e){
        // LIFFが無い/初期化失敗でもフローは継続
        console.warn("LIFF init error:", e);
      }
    })();

    async function saveConsentAndStart(){
      if(!USER_TOKEN){
        alert("無効なアクセスです（user_token が見つかりません）");
        return;
      }

      // 送信ペイロード
      const payload = {
        agree_privacy: document.getElementById('chk_pp').checked,
        agree_cookie: document.getElementById('chk_cookie').checked,
        understand_external_send: document.getElementById('chk_xfer').checked,
        understand_ai_may_be_wrong: document.getElementById('chk_ai_limits').checked,
        meta: {
          state: getParam("state"),
          ab: getParam("ab"),
          utm_source: getParam("utm_source"),
          utm_medium: getParam("utm_medium"),
          utm_campaign: getParam("utm_campaign"),
          utm_content: getParam("utm_content"),
          ua: navigator.userAgent
        }
      };

      // UIロック
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = "保存中…";

      try {
        // 1) 同意保存（サーバ側：/consent/save は非同期でWORMも処理）
        const saveQs = new URLSearchParams({ user_token: USER_TOKEN, scope: "ai", version: POLICY_VERSION }).toString();
        const r1 = await fetch(`/consent/save?${saveQs}`, {
          method: "POST",
          headers: {
            "Content-Type":"application/json",
            "X-User-Token": USER_TOKEN
          },
          body: JSON.stringify(payload),
          credentials: "omit"
        });
        if(!r1.ok) throw new Error("consent_save_failed");

        // 2) AI相談を自動開始（サーバから定型文をPush：ユーザー操作不要）
        //    可能なら X-User-Id を付ける（サーバ側は header/JSON どちらでも拾える実装推奨）
        const hdrs = { "Content-Type":"application/json" };
        if (LINE_USER_ID) hdrs["X-User-Id"] = LINE_USER_ID;

        fetch("/line/after-consent", {
          method: "POST",
          headers: hdrs,
          body: JSON.stringify({ user_token: USER_TOKEN, user_id: LINE_USER_ID || undefined })
        }).catch(()=>{});

        // 3) LINEアプリへ戻す（LIFF内なら閉じる、外部ならDeep Link）
        try {
          if(window.liff && liff.isInClient()){ liff.closeWindow(); return; }
        } catch(e){}
        openLineChatWithAI();
      } catch(e) {
        alert("保存に失敗しました。時間をおいて再度お試しください。");
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    btn.addEventListener("click", saveConsentAndStart);
  </script>
</body>
</html>
