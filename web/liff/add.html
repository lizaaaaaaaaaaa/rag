<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>公式LINEを友だち追加</title>
  <style>
    :root { color-scheme: light; }
    body{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;margin:0;background:#f6f7f9}
    .wrap{max-width:560px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
    h1{font-size:22px;margin:0 0 12px}
    p{color:#333;line-height:1.7}
    a.btn{display:inline-block;font-size:16px;padding:10px 16px;border-radius:8px;text-decoration:none;background:#06C755;color:#fff}
    a{color:#06C755}
    .small{color:#555;margin-top:12px;font-size:13px}
  </style>

  <!-- ✅ GA4（現行の計測IDを維持） -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B8988S3RCZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B8988S3RCZ'); // 既存IDをそのまま使用
  </script>
</head>
<body>
  <div class="wrap">
    <h1>公式LINEを友だち追加</h1>
    <p>「LINEで相談する」を押すと、LINEが開きます（友だち追加後そのままトークに移動）。</p>
    <p><a id="openLine" class="btn" href="#">LINEで相談する</a></p>
    <p class="small">うまく開かない場合は <a id="rawLink" href="#" target="_blank" rel="noopener">こちら</a> をタップしてください。</p>
    <noscript><p><a id="nos" href="#" target="_blank" rel="noopener">JavaScriptを有効にできない場合はこちら</a></p></noscript>
  </div>

  <script>
    // __LINE_BASIC_ID__ はサーバ側（liff_pages.py）で @付きに置換されます。
    const BASIC = "__LINE_BASIC_ID__".replace(/^@@/, "@"); // 二重@対策
    const msg   = encodeURIComponent("AI相談");            // メッセージ欄に自動入力
    // 友だちでなければ追加画面→トーク起動、友だちなら即トーク起動
    const url   = `https://line.me/R/oaMessage/${BASIC}/?${msg}`;

    // リンク設定
    const a = document.getElementById("openLine");
    const b = document.getElementById("rawLink");
    a.href = url; b.href = url;
    const nos = document.getElementById("nos"); if (nos) nos.href = url;

    // --- GA4 イベント計測（現行ロジックを踏襲） ---
    (function trackLanding(){
      try {
        const sp = new URL(location.href).searchParams;
        let state        = sp.get('state');
        let ab           = sp.get('ab');
        let utm_source   = sp.get('utm_source');
        let utm_medium   = sp.get('utm_medium');
        let utm_campaign = sp.get('utm_campaign');
        let utm_content  = sp.get('utm_content');

        // liff.state="?state=...&utm_*=..." に入っている場合も吸収
        if (!state || !utm_source || !utm_medium || !utm_campaign) {
          const ls = sp.get('liff.state');
          if (ls) {
            const inner = new URLSearchParams(ls.startsWith('?') ? ls.slice(1) : ls);
            state        = state        || inner.get('state');
            ab           = ab           || inner.get('ab');
            utm_source   = utm_source   || inner.get('utm_source');
            utm_medium   = utm_medium   || inner.get('utm_medium');
            utm_campaign = utm_campaign || inner.get('utm_campaign');
            utm_content  = utm_content  || inner.get('utm_content');
          }
        }

        const payload = {
          state:        state        || '(none)',
          ab:           ab           || '(none)',
          utm_source:   utm_source   || '(none)',
          utm_medium:   utm_medium   || '(none)',
          utm_campaign: utm_campaign || '(none)',
          utm_content:  utm_content  || '(none)',
          referrer:     document.referrer || '(direct)',
          ts:           new Date().toISOString()
        };
        if (typeof gtag === 'function') gtag('event', 'line_add_landing', payload);
        try { localStorage.setItem('line_add_attrs', JSON.stringify(payload)); } catch(e) {}
      } catch(e){}
    })();

    // DeepLink クリック時のイベント
    a.addEventListener('click', function(){
      try {
        if (typeof gtag === 'function') gtag('event', 'line_open_deeplink', {method:'oaMessage', ts:new Date().toISOString()});
      } catch(e){}
    }, {passive:true});
  </script>
</body>
</html>
