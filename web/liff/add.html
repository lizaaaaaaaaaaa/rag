<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>公式LINEを友だち追加</title>
<style>body{font-family:system-ui,Roboto,'Hiragino Sans',Meiryo,sans-serif;margin:0;background:#f6f7f9}
.wrap{max-width:560px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}
.btn{padding:.7rem 1rem;border:1px solid #ddd;border-radius:.7rem;cursor:pointer}
</style></head><body>
<div class="wrap">
  <h1>公式LINEを友だち追加</h1>
  <p>下のボタンから友だち追加してください。</p>
  <p><button id="add" class="btn">友だち追加</button></p>
  <p class="small">追加後はLINEアプリのトーク画面から「AI相談」を押してご利用ください。</p>
</div>
<script>
const BASIC_ID = "487urklv"; // @なし
const addInApp = `line://ti/p/@${BASIC_ID}`;
const addOnWeb = `https://line.me/R/ti/p/%40${BASIC_ID}`;
document.getElementById("add").addEventListener("click", ()=>{
  if (/Line\/\d+/.test(navigator.userAgent)) { location.href = addInApp; }
  else { location.href = addOnWeb; }
});
</script></body></html>
