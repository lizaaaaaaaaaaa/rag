# deployment/cloud_scheduler.yaml
# Cloud Scheduler設定とデプロイメント設定

# Google Cloud Run デプロイメント設定
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-consent-system
  namespace: default
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/cpu: "1000m"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/rag-consent-system:latest
        ports:
        - containerPort: 8080
        env:
        # 基本設定
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: BASE_URL
          value: "https://your-domain.com"
        - name: GOOGLE_CLOUD_PROJECT
          value: "your-project-id"
        - name: GOOGLE_CLOUD_REGION
          value: "asia-northeast1"
        
        # Firestore設定
        - name: FIRESTORE_DATABASE_ID
          value: "(default)"
        
        # Cloud Storage設定
        - name: CONSENT_WORM_BUCKET
          value: "your-project-id-consent-worm"
        - name: AUDIT_WORM_BUCKET
          value: "your-project-id-audit-worm"
        - name: MANIFEST_BUCKET
          value: "your-project-id-manifests"
        
        # LINE設定（Secret Managerから取得）
        - name: LINE_CHANNEL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: line-credentials
              key: channel-access-token
        - name: LINE_CHANNEL_SECRET
          valueFrom:
            secretKeyRef:
              name: line-credentials
              key: channel-secret
        - name: LIFF_ID
          valueFrom:
            secretKeyRef:
              name: line-credentials
              key: liff-id
        - name: LIFF_URL
          value: "https://liff.line.me/YOUR-LIFF-ID"
        
        # OpenAI設定
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: api-key
        - name: OPENAI_MODEL
          value: "gpt-4"
        
        # セキュリティ設定
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: security-keys
              key: jwt-secret
        
        # 同意管理設定
        - name: PRIVACY_POLICY_VERSION
          value: "pp_v1.3"
        - name: TERMS_OF_SERVICE_VERSION
          value: "tos_v1.4"
        - name: CONSENT_VALIDITY_MONTHS
          value: "12"
        
        # 監査設定
        - name: DAILY_MANIFEST_ENABLED
          value: "true"
        - name: WORM_STORAGE_ENABLED
          value: "true"
        - name: AUTO_DELETION_ENABLED
          value: "true"
        
        # レート制限設定
        - name: RATE_LIMIT_CALLS
          value: "100"
        - name: RATE_LIMIT_PERIOD
          value: "60"
        
        # CORS設定
        - name: ALLOWED_ORIGINS
          value: "https://your-domain.com,https://liff.line.me"
        - name: ALLOWED_HOSTS
          value: "your-domain.com,*.your-domain.com"
        
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        
        # ヘルスチェック
        livenessProbe:
          httpGet:
            path: /api/admin/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/admin/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---

# Cloud Tasks キュー設定
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-tasks-config
data:
  queues.yaml: |
    # 削除タスクキュー
    - name: deletion-queue
      rateLimits:
        maxDispatchesPerSecond: 10
        maxBurstSize: 20
      retryConfig:
        maxAttempts: 5
        minBackoff: 60s
        maxBackoff: 3600s
        maxDoublings: 16
      location: asia-northeast1
    
    # マニフェスト生成キュー
    - name: manifest-queue
      rateLimits:
        maxDispatchesPerSecond: 1
        maxBurstSize: 5
      retryConfig:
        maxAttempts: 3
        minBackoff: 300s
        maxBackoff: 1800s
        maxDoublings: 5
      location: asia-northeast1

---

# Cloud Scheduler ジョブ設定
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-manifest-generator
spec:
  schedule: "0 2 * * *"  # 毎日午前2時（JST 11時）
  timeZone: "Asia/Tokyo"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: manifest-generator
            image: gcr.io/PROJECT_ID/rag-consent-system:latest
            command: ["python", "-c"]
            args:
            - |
              import asyncio
              import os
              from api.services.manifest_audit_service import ManifestAuditService
              from datetime import datetime, timedelta
              
              async def main():
                  service = ManifestAuditService(os.environ.get('GOOGLE_CLOUD_PROJECT'))
                  yesterday = datetime.now() - timedelta(days=1)
                  manifest = await service.generate_daily_manifest(yesterday)
                  print(f"Generated manifest: {manifest['manifest_id']}")
              
              asyncio.run(main())
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "your-project-id"
          restartPolicy: OnFailure
      backoffLimit: 3

---

# Cloud Scheduler - データ保存期限チェック
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-check
spec:
  schedule: "0 3 * * *"  # 毎日午前3時（JST 12時）
  timeZone: "Asia/Tokyo"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: retention-checker
            image: gcr.io/PROJECT_ID/rag-consent-system:latest
            command: ["python", "-c"]
            args:
            - |
              import asyncio
              import os
              from api.services.lifecycle_auto_deletion_service import LifecycleAutoDeleteService
              
              async def main():
                  service = LifecycleAutoDeleteService(os.environ.get('GOOGLE_CLOUD_PROJECT'))
                  expired_data = await service.check_retention_expiry()
                  print(f"Found {len(expired_data)} expired data items")
                  
                  # 自動削除対象の処理
                  for item in expired_data:
                      if item.get('auto_delete'):
                          print(f"Processing auto-deletion for {item['document_id']}")
              
              asyncio.run(main())
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "your-project-id"
          restartPolicy: OnFailure
      backoffLimit: 3

---

# Cloud Functions for webhook処理
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-functions-config
data:
  main.py: |
    import functions_framework
    import asyncio
    import os
    from api.services.lifecycle_auto_deletion_service import execute_scheduled_deletion
    from api.services.manifest_audit_service import scheduled_manifest_generation
    
    @functions_framework.http
    def execute_deletion(request):
        """削除実行Cloud Function"""
        return asyncio.run(execute_scheduled_deletion(request))
    
    @functions_framework.http
    def generate_manifest(request):
        """マニフェスト生成Cloud Function"""
        return asyncio.run(scheduled_manifest_generation(None, None))
    
    @functions_framework.http
    def health_check(request):
        """ヘルスチェック"""
        return {"status": "healthy", "timestamp": datetime.now().isoformat()}
  
  requirements.txt: |
    functions-framework==3.*
    google-cloud-firestore==2.*
    google-cloud-storage==2.*
    google-cloud-tasks==2.*
    fastapi==0.104.*
    pydantic==2.*

---

# Terraform設定（infrastructure.tf）
terraform_config: |
  # terraform/infrastructure.tf
  
  terraform {
    required_version = ">= 1.0"
    required_providers {
      google = {
        source  = "hashicorp/google"
        version = "~> 5.0"
      }
    }
  }
  
  provider "google" {
    project = var.project_id
    region  = var.region
  }
  
  variable "project_id" {
    description = "Google Cloud Project ID"
    type        = string
  }
  
  variable "region" {
    description = "Google Cloud Region"
    type        = string
    default     = "asia-northeast1"
  }
  
  # Firestore Database
  resource "google_firestore_database" "default" {
    project                     = var.project_id
    name                       = "(default)"
    location_id                = var.region
    type                       = "FIRESTORE_NATIVE"
    concurrency_mode           = "OPTIMISTIC"
    app_engine_integration_mode = "DISABLED"
  }
  
  # Cloud Storage Buckets (WORM)
  resource "google_storage_bucket" "consent_worm" {
    name          = "${var.project_id}-consent-worm"
    location      = var.region
    force_destroy = false
    
    uniform_bucket_level_access = true
    
    retention_policy {
      retention_period = 157680000  # 5年（秒）
      is_locked        = true
    }
    
    lifecycle_rule {
      condition {
        age = 90
      }
      action {
        type          = "SetStorageClass"
        storage_class = "COLDLINE"
      }
    }
    
    lifecycle_rule {
      condition {
        age = 365
      }
      action {
        type          = "SetStorageClass"
        storage_class = "ARCHIVE"
      }
    }
    
    versioning {
      enabled = true
    }
    
    logging {
      log_bucket        = google_storage_bucket.audit_logs.name
      log_object_prefix = "consent-worm-access/"
    }
  }
  
  resource "google_storage_bucket" "audit_worm" {
    name          = "${var.project_id}-audit-worm"
    location      = var.region
    force_destroy = false
    
    uniform_bucket_level_access = true
    
    retention_policy {
      retention_period = 157680000  # 5年（秒）
      is_locked        = true
    }
    
    versioning {
      enabled = true
    }
  }
  
  resource "google_storage_bucket" "manifests" {
    name          = "${var.project_id}-manifests"
    location      = var.region
    force_destroy = false
    
    uniform_bucket_level_access = true
    
    retention_policy {
      retention_period = 157680000  # 5年（秒）
      is_locked        = true
    }
  }
  
  resource "google_storage_bucket" "audit_logs" {
    name          = "${var.project_id}-audit-logs"
    location      = var.region
    force_destroy = false
    
    uniform_bucket_level_access = true
  }
  
  # Cloud Tasks Queues
  resource "google_cloud_tasks_queue" "deletion_queue" {
    name     = "deletion-queue"
    location = var.region
    
    rate_limits {
      max_dispatches_per_second = 10
      max_burst_size           = 20
    }
    
    retry_config {
      max_attempts       = 5
      min_backoff       = "60s"
      max_backoff       = "3600s"
      max_doublings     = 16
    }
  }
  
  resource "google_cloud_tasks_queue" "manifest_queue" {
    name     = "manifest-queue"
    location = var.region
    
    rate_limits {
      max_dispatches_per_second = 1
      max_burst_size           = 5
    }
    
    retry_config {
      max_attempts       = 3
      min_backoff       = "300s"
      max_backoff       = "1800s"
      max_doublings     = 5
    }
  }
  
  # Cloud Scheduler Jobs
  resource "google_cloud_scheduler_job" "daily_manifest" {
    name             = "daily-manifest-generator"
    description      = "Daily manifest generation for audit trail"
    schedule         = "0 2 * * *"
    time_zone        = "Asia/Tokyo"
    attempt_deadline = "320s"
    
    http_target {
      http_method = "POST"
      uri         = "https://${var.region}-${var.project_id}.cloudfunctions.net/generate-manifest"
      
      headers = {
        "Content-Type" = "application/json"
      }
      
      body = base64encode(jsonencode({
        "trigger": "daily_schedule"
      }))
    }
    
    retry_config {
      retry_count = 3
    }
  }
  
  resource "google_cloud_scheduler_job" "retention_check" {
    name             = "retention-check"
    description      = "Daily data retention policy check"
    schedule         = "0 3 * * *"
    time_zone        = "Asia/Tokyo"
    attempt_deadline = "320s"
    
    http_target {
      http_method = "POST"
      uri         = "https://${var.region}-${var.project_id}.cloudfunctions.net/retention-check"
      
      headers = {
        "Content-Type" = "application/json"
      }
    }
    
    retry_config {
      retry_count = 3
    }
  }
  
  # Secret Manager
  resource "google_secret_manager_secret" "line_credentials" {
    secret_id = "line-credentials"
    
    replication {
      user_managed {
        replicas {
          location = var.region
        }
      }
    }
  }
  
  resource "google_secret_manager_secret" "openai_credentials" {
    secret_id = "openai-credentials"
    
    replication {
      user_managed {
        replicas {
          location = var.region
        }
      }
    }
  }
  
  resource "google_secret_manager_secret" "security_keys" {
    secret_id = "security-keys"
    
    replication {
      user_managed {
        replicas {
          location = var.region
        }
      }
    }
  }
  
  # IAM
  resource "google_service_account" "rag_system" {
    account_id   = "rag-consent-system"
    display_name = "RAG Consent System Service Account"
    description  = "Service account for RAG system with consent management"
  }
  
  resource "google_project_iam_member" "rag_system_firestore" {
    project = var.project_id
    role    = "roles/datastore.user"
    member  = "serviceAccount:${google_service_account.rag_system.email}"
  }
  
  resource "google_project_iam_member" "rag_system_storage" {
    project = var.project_id
    role    = "roles/storage.admin"
    member  = "serviceAccount:${google_service_account.rag_system.email}"
  }
  
  resource "google_project_iam_member" "rag_system_tasks" {
    project = var.project_id
    role    = "roles/cloudtasks.admin"
    member  = "serviceAccount:${google_service_account.rag_system.email}"
  }
  
  resource "google_project_iam_member" "rag_system_secretmanager" {
    project = var.project_id
    role    = "roles/secretmanager.secretAccessor"
    member  = "serviceAccount:${google_service_account.rag_system.email}"
  }
  
  # Outputs
  output "consent_bucket_name" {
    value = google_storage_bucket.consent_worm.name
  }
  
  output "audit_bucket_name" {
    value = google_storage_bucket.audit_worm.name
  }
  
  output "manifest_bucket_name" {
    value = google_storage_bucket.manifests.name
  }
  
  output "service_account_email" {
    value = google_service_account.rag_system.email
  }

---

# Docker設定
dockerfile: |
  # Dockerfile
  FROM python:3.11-slim
  
  # 作業ディレクトリ設定
  WORKDIR /app
  
  # システムパッケージ更新
  RUN apt-get update && apt-get install -y \
      gcc \
      g++ \
      && rm -rf /var/lib/apt/lists/*
  
  # Pythonパッケージインストール
  COPY requirements.txt .
  RUN pip install --no-cache-dir -r requirements.txt
  
  # アプリケーションコピー
  COPY . .
  
  # 環境変数
  ENV PYTHONPATH=/app
  ENV PYTHONUNBUFFERED=1
  
  # ポート公開
  EXPOSE 8080
  
  # ヘルスチェック
  HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
    CMD curl -f http://localhost:8080/api/admin/health || exit 1
  
  # 実行
  CMD ["python", "main.py"]

requirements_txt: |
  # requirements.txt
  fastapi==0.104.1
  uvicorn[standard]==0.24.0
  pydantic==2.5.0
  google-cloud-firestore==2.13.1
  google-cloud-storage==2.10.0
  google-cloud-secretmanager==2.17.1
  google-cloud-tasks==2.14.1
  google-cloud-scheduler==2.11.1
  line-bot-sdk==3.5.0
  openai==1.3.0
  python-multipart==0.0.6
  python-jose[cryptography]==3.3.0
  passlib[bcrypt]==1.7.4
  email-validator==2.1.0
  phonenumbers==8.13.25
  cryptography==41.0.7
  PyJWT==2.8.0
  python-dotenv==1.0.0
  aiofiles==23.2.1
  httpx==0.25.2
  pandas==2.1.3
  numpy==1.25.2

---

# デプロイスクリプト
deploy_script: |
  #!/bin/bash
  # deploy.sh
  
  set -e
  
  # 設定
  PROJECT_ID="your-project-id"
  REGION="asia-northeast1"
  SERVICE_NAME="rag-consent-system"
  
  echo "🚀 Starting deployment of RAG Consent System..."
  
  # Google Cloud プロジェクト設定
  gcloud config set project $PROJECT_ID
  
  # Docker イメージビルド
  echo "📦 Building Docker image..."
  gcloud builds submit --tag gcr.io/$PROJECT_ID/$SERVICE_NAME
  
  # Cloud Run デプロイ
  echo "🌐 Deploying to Cloud Run..."
  gcloud run deploy $SERVICE_NAME \
    --image gcr.io/$PROJECT_ID/$SERVICE_NAME \
    --platform managed \
    --region $REGION \
    --allow-unauthenticated \
    --memory 2Gi \
    --cpu 1 \
    --concurrency 80 \
    --timeout 300 \
    --min-instances 1 \
    --max-instances 100 \
    --set-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,ENVIRONMENT=production
  
  # Terraform インフラ構築
  echo "🏗️  Setting up infrastructure with Terraform..."
  cd terraform
  terraform init
  terraform plan -var="project_id=$PROJECT_ID" -var="region=$REGION"
  terraform apply -var="project_id=$PROJECT_ID" -var="region=$REGION" -auto-approve
  cd ..
  
  # Cloud Functions デプロイ
  echo "⚡ Deploying Cloud Functions..."
  gcloud functions deploy generate-manifest \
    --runtime python311 \
    --trigger-http \
    --allow-unauthenticated \
    --region $REGION \
    --memory 512MB \
    --timeout 540s
  
  gcloud functions deploy execute-deletion \
    --runtime python311 \
    --trigger-http \
    --allow-unauthenticated \
    --region $REGION \
    --memory 512MB \
    --timeout 540s
  
  # 設定検証
  echo "✅ Validating deployment..."
  CLOUD_RUN_URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
  
  # ヘルスチェック
  echo "🔍 Running health check..."
  curl -f "$CLOUD_RUN_URL/api/admin/health" || {
    echo "❌ Health check failed"
    exit 1
  }
  
  echo "🎉 Deployment completed successfully!"
  echo "📍 Service URL: $CLOUD_RUN_URL"
  echo "📋 Next steps:"
  echo "  1. Configure LINE Bot webhook: $CLOUD_RUN_URL/webhook"
  echo "  2. Update LIFF URL in LINE Developers Console"
  echo "  3. Set up monitoring and alerting"
  echo "  4. Test consent flow end-to-end"