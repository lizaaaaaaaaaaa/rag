# docker-compose.yml - 開発・本番環境用

version: '3.8'

services:
  # メインアプリケーション
  unified-chat:
    build: .
    container_name: unified-chat-app
    ports:
      - "8080:8080"
    environment:
      # アプリケーション設定
      - UNIFIED_CHAT_MODE=enabled
      - LINE_BOT_MODE=ultra_fast_financial
      - ENABLE_RAG_INITIALIZATION=true
      - ENABLE_DUPLICATE_PREVENTION=true
      
      # キャッシュ設定
      - CACHE_MAX_SIZE=1000
      - CACHE_TTL_SECONDS=3600
      - CACHE_PERSISTENCE=true
      
      # パフォーマンス設定
      - MAX_WORKERS=4
      - LOG_LEVEL=INFO
      - DEBUG_MODE=false
      
      # 外部サービス設定（必要に応じて設定）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      
    volumes:
      # データの永続化
      - ./data:/app/data
      - ./logs:/app/logs
      - ./templates:/app/templates
      
      # 設定ファイル（必要に応じて）
      - ./config:/app/config
      
    networks:
      - unified-chat-network
    
    # リソース制限
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    # 依存サービスの起動を待つ
    depends_on:
      redis:
        condition: service_healthy
    
    # 再起動ポリシー
    restart: unless-stopped
    
    # ログ設定
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis（キャッシュ・セッション管理用）
  redis:
    image: redis:7-alpine
    container_name: unified-chat-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - unified-chat-network
    restart: unless-stopped
    
    # ヘルスチェック
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    # リソース制限
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  # Nginx（リバースプロキシ・ロードバランサー）
  nginx:
    image: nginx:alpine
    container_name: unified-chat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL証明書用（本番環境）
    networks:
      - unified-chat-network
    depends_on:
      - unified-chat
    restart: unless-stopped
    
    # ログ設定
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Prometheus（メトリクス収集用）- オプション
  prometheus:
    image: prom/prometheus:latest
    container_name: unified-chat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - unified-chat-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    profiles: ["monitoring"]

  # Grafana（可視化ダッシュボード）- オプション
  grafana:
    image: grafana/grafana:latest
    container_name: unified-chat-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - unified-chat-network
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

# ネットワーク定義
networks:
  unified-chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ボリューム定義
volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local