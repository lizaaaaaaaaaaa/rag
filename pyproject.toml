[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-llm-project"
version = "1.0.0"
description = "RAG LLM Project with Consent Management System"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "RAG LLM Project Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "line-bot-sdk>=3.5.0",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "openai>=1.35.3",
    "langchain-openai>=0.1.7",
    "langchain>=0.1.20",
    "langchain-core>=0.1.53",
    "langchain-community>=0.0.38",
    "langsmith>=0.1.147",
    "transformers>=4.55.2",
    "tokenizers>=0.21.4",
    "huggingface-hub>=0.34.4",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=5.1.0",
    "accelerate>=1.10.0",
    "torch>=2.5.1",
    "sentencepiece>=0.2.1",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.2",
    "bcrypt>=4.3.0",
    "pypdf>=3.17.1",
    "protobuf>=4.25.8",
    "streamlit>=1.28.1",
    "google-auth>=2.40.3",
    "google-cloud-firestore>=2.21.0",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.10",
    "google-cloud-storage>=2.10.0",
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "PyJWT>=2.10.1",
    "requests>=2.31.0",
    "google-cloud-secret-manager>=2.20.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.3.1",
    "redis>=6.4.0",
    "mecab-python3>=1.0.10",
    "datasets>=2.19.1",
    "nest-asyncio>=1.6.0",
    "psutil>=5.9.6",
    "google-cloud-logging>=3.8.0",
    "beautifulsoup4>=4.13.4",
    "feedparser>=6.0.11",
    "google-cloud-scheduler>=2.16.1",
    "functions-framework>=3.8.3",
    "pytest>=8.4.1",
    "sqlalchemy>=2.0.43",
    "asyncpg>=0.30.0",
    "aiofiles>=23.2.1",
    "aioredis>=2.0.1",
    "aiohttp>=3.8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true