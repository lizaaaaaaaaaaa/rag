# Web用テンプレート（詳細・フォーマル・情報量重視）
web:
  坪単価:
    content: |
      坪単価についてご案内いたします。

      **当社の坪単価目安**
      ・標準仕様：約70～85万円/坪
      ・高性能仕様：約85～100万円/坪  
      ・プレミアム仕様：約100～120万円/坪

      **含まれる標準内容**
      ・耐震等級3の構造（建築基準法の1.5倍の耐震性）
      ・長期優良住宅認定対応
      ・高断熱・高気密仕様（省エネ等級4以上）
      ・標準設備一式（システムキッチン、ユニットバス等）

      **価格変動要因**
      - 建物の形状・間取りの複雑さ
      - 設備・仕様のグレード
      - 立地条件・地盤状況
      - 付帯工事の内容

      お客様のご希望される仕様や条件により変動いたします。より詳細なお見積りをご希望でしたら、お気軽にお問い合わせください。
    tags: ["価格", "見積もり", "基本情報", "坪単価"]
    priority: 10
    category: "pricing"
    
  標準仕様:
    content: |
      標準仕様についてご説明いたします。

      **構造・性能**
      ・耐震等級3（最高等級）を標準採用
      ・長期優良住宅認定対応
      ・省エネ等級4以上（ZEH基準対応可能）
      ・高断熱・高気密仕様（UA値0.6以下、C値1.0以下）

      **主要設備仕様**
      ・システムキッチン（食器洗い乾燥機付き）
      ・ユニットバス（1坪タイプ、浴室乾燥機付き）
      ・洗面化粧台（3面鏡、LED照明）
      ・トイレ（温水洗浄便座付き、節水型）
      ・給湯設備（エコキュート標準）

      **内外装仕様**
      ・外壁：高耐久サイディング
      ・屋根：カラーベスト（遮熱型）
      ・内装：クロス仕上げ、フローリング
      ・建具：室内ドア、収納扉一式

      より詳しい仕様書については、資料請求または展示場見学でご確認いただけます。
    tags: ["仕様", "設備", "標準", "基本"]
    priority: 9
    category: "specifications"
    
  耐震性能:
    content: |
      耐震性能についてご案内いたします。

      **耐震等級について**
      ・耐震等級3（最高等級）を標準採用
      ・建築基準法の1.5倍の耐震強度を実現
      ・大規模地震でも軽微な補修で継続使用可能

      **構造計算・設計**
      ・許容応力度計算による詳細な構造計算実施
      ・地盤調査に基づく基礎設計
      ・構造専門技術者による設計チェック

      **使用材料・工法**
      ・構造用集成材（強度・品質が安定）
      ・金物工法による強固な接合部
      ・ベタ基礎による堅固な基礎構造
      ・制振ダンパー設置（オプション）

      **品質保証**
      ・構造躯体20年保証
      ・地盤保証20年
      ・瑕疵担保責任保険対応
      ・第三者機関による施工検査

      安心・安全な住まいをお約束いたします。
    tags: ["耐震", "安全", "構造", "地震"]
    priority: 8
    category: "performance"
    
  断熱性能:
    content: |
      断熱性能についてご案内いたします。

      **断熱等級・基準値**
      ・断熱等級4以上（ZEH基準対応）
      ・UA値：0.6以下（6地域基準）
      ・C値：1.0以下（気密性能）
      ・省エネ基準をクリアした高性能住宅

      **使用断熱材**
      ・外壁：高性能グラスウール16K（105mm）
      ・屋根：吹付硬質ウレタンフォーム（150mm）
      ・基礎：押出法ポリスチレンフォーム（65mm）
      ・窓：樹脂サッシ+Low-E複層ガラス

      **快適性・経済性**
      ・夏涼しく、冬暖かい快適な室内環境
      ・光熱費の大幅削減（年間10～15万円削減例）
      ・結露抑制・防止
      ・室内温度差の軽減

      詳しくは展示場でご体感いただけます。
    tags: ["断熱", "省エネ", "ZEH", "温度"]
    priority: 8
    category: "performance"
    
  補助金:
    content: |
      住宅購入時の補助金・支援制度についてご案内いたします。

      **主な国の補助金制度**

      **1. ZEH補助金**
      ・対象：ゼロエネルギーハウス（ZEH）
      ・補助額：定額55万円～（条件により異なる）
      ・加算：蓄電池設置で最大20万円追加

      **2. こどもエコすまい支援事業**
      ・対象：子育て世帯・若年夫婦世帯
      ・補助額：最大100万円
      ・省エネ性能に応じて補助額変動

      **3. 住宅ローン減税**
      ・所得税の控除制度（年間最大35万円）
      ・控除期間：13年間（認定住宅等）
      ・住民税からも一部控除可能

      **地方自治体の補助金**
      ・市町村独自の住宅取得支援制度
      ・移住・定住促進補助金
      ・多子世帯向け支援制度

      ※制度は年度ごとに変更される可能性があります。
      最新情報については、弊社スタッフまでお問い合わせください。
    tags: ["補助金", "支援制度", "税制", "ZEH"]
    priority: 7
    category: "financial"
    
  資金計画:
    content: |
      住宅購入の資金計画についてご案内いたします。

      **資金計画の基本**
      住宅購入は人生最大の買い物です。無理のない返済計画を立てることが重要です。

      **必要資金の内訳**
      1. **建物本体価格**（坪単価 × 延床面積）
      2. **付帯工事費**（外構、地盤改良等：本体価格の15-20%）
      3. **諸費用**（登記、融資手数料等：総額の5-8%）
      4. **土地代**（土地購入の場合）

      **住宅ローンの目安**
      ・借入可能額：年収の5-7倍程度
      ・返済比率：月収の25%以内（理想は20%以内）
      ・返済期間：定年時までに完済が理想

      **月々の返済例**（35年返済、金利1.0%）
      - 借入3000万円：約84,000円
      - 借入3500万円：約98,000円  
      - 借入4000万円：約113,000円

      弊社では、ファイナンシャルプランナーによる無料資金計画相談を承っております。
    tags: ["資金計画", "住宅ローン", "予算", "返済"]
    priority: 9
    category: "financial"
    
  AI相談:
    content: |
      AI住まい相談へようこそ！

      住まいづくりに関するご質問に、AIがお答えいたします。どのようなことでもお気軽にお尋ねください。

      **よくあるご質問**
      ・坪単価について教えて
      ・標準仕様はどのような内容？
      ・耐震性能について知りたい
      ・断熱性能はどの程度？
      ・利用できる補助金制度は？
      ・資金計画の立て方は？

      **専門分野**
      - 住宅の性能・仕様
      - 価格・見積もり
      - 補助金・税制優遇
      - 資金計画・住宅ローン
      - 土地・立地条件
      - 建築プロセス

      何でもお聞きください。より詳しい情報が必要でしたら、専門スタッフにおつなぎすることも可能です。
    tags: ["AI相談", "案内", "サポート"]
    priority: 5
    category: "service"

