# 設定オプション（リッチメニュー対応更新）
settings:
  enable_dynamic_content: false  # リッチメニュー応答では動的コンテンツ無効
  enable_personalization: false  # リッチメニュー応答では個人化無効
  fallback_language: "ja"
  max_template_length: 2000
  enable_emoji_optimization: false  # リッチメニュー応答では絵文字最適化無効
  enable_platform_detection: true
  preserve_richmenu_content: true  # リッチメニューコンテンツ保持
  richmenu_templates_only: true   # リッチメニューテンプレートのみ有効化
  disable_auto_enhancement: true  # 自動拡張無効化

# 機能制御フラグ（リッチメニュー特化）
feature_flags:
  richmenu_mode: true              # リッチメニューモード有効
  preserve_exact_content: true     # 正確なコンテンツ保持
  disable_content_modification: true  # コンテンツ修正無効
  strict_template_matching: true   # 厳密テンプレートマッチング
  web_templates_for_questions: true  # 質問応答時はWebテンプレート使用