# Web用テンプレート（詳細・フォーマル・情報量重視）- リッチメニュー非関連のみ有効
web:
  坪単価:
    content: |
      坪単価についてご案内いたします。

      **当社の坪単価目安**
      ・標準仕様：約70～85万円/坪
      ・高性能仕様：約85～100万円/坪  
      ・プレミアム仕様：約100～120万円/坪

      **含まれる標準内容**
      ・耐震等級3の構造（建築基準法の1.5倍の耐震性）
      ・長期優良住宅認定対応
      ・高断熱・高気密仕様（省エネ等級4以上）
      ・標準設備一式（システムキッチン、ユニットバス等）

      **価格変動要因**
      - 建物の形状・間取りの複雑さ
      - 設備・仕様のグレード
      - 立地条件・地盤状況
      - 付帯工事の内容

      お客様のご希望される仕様や条件により変動いたします。より詳細なお見積りをご希望でしたら、お気軽にお問い合わせください。
    tags: ["価格", "見積もり", "基本情報", "坪単価"]
    priority: 10
    category: "pricing"
    enabled: true
    
  標準仕様:
    content: |
      標準仕様についてご説明いたします。

      **構造・性能**
      ・耐震等級3（最高等級）を標準採用
      ・長期優良住宅認定対応
      ・省エネ等級4以上（ZEH基準対応可能）
      ・高断熱・高気密仕様（UA値0.6以下、C値1.0以下）

      **主要設備仕様**
      ・システムキッチン（食器洗い乾燥機付き）
      ・ユニットバス（1坪タイプ、浴室乾燥機付き）
      ・洗面化粧台（3面鏡、LED照明）
      ・トイレ（温水洗浄便座付き、節水型）
      ・給湯設備（エコキュート標準）

      **内外装仕様**
      ・外壁：高耐久サイディング
      ・屋根：カラーベスト（遮熱型）
      ・内装：クロス仕上げ、フローリング
      ・建具：室内ドア、収納扉一式

      より詳しい仕様書については、資料請求または展示場見学でご確認いただけます。
    tags: ["仕様", "設備", "標準", "基本"]
    priority: 9
    category: "specifications"
    enabled: true
    
  耐震性能:
    content: |
      耐震性能についてご案内いたします。

      **耐震等級について**
      ・耐震等級3（最高等級）を標準採用
      ・建築基準法の1.5倍の耐震強度を実現
      ・大規模地震でも軽微な補修で継続使用可能

      **構造計算・設計**
      ・許容応力度計算による詳細な構造計算実施
      ・地盤調査に基づく基礎設計
      ・構造専門技術者による設計チェック

      **使用材料・工法**
      ・構造用集成材（強度・品質が安定）
      ・金物工法による強固な接合部
      ・ベタ基礎による堅固な基礎構造
      ・制振ダンパー設置（オプション）

      **品質保証**
      ・構造躯体20年保証
      ・地盤保証20年
      ・瑕疵担保責任保険対応
      ・第三者機関による施工検査

      安心・安全な住まいをお約束いたします。
    tags: ["耐震", "安全", "構造", "地震"]
    priority: 8
    category: "performance"
    enabled: true
    
  断熱性能:
    content: |
      断熱性能についてご案内いたします。

      **断熱等級・基準値**
      ・断熱等級4以上（ZEH基準対応）
      ・UA値：0.6以下（6地域基準）
      ・C値：1.0以下（気密性能）
      ・省エネ基準をクリアした高性能住宅

      **使用断熱材**
      ・外壁：高性能グラスウール16K（105mm）
      ・屋根：吹付硬質ウレタンフォーム（150mm）
      ・基礎：押出法ポリスチレンフォーム（65mm）
      ・窓：樹脂サッシ+Low-E複層ガラス

      **快適性・経済性**
      ・夏涼しく、冬暖かい快適な室内環境
      ・光熱費の大幅削減（年間10～15万円削減例）
      ・結露抑制・防止
      ・室内温度差の軽減

      詳しくは展示場でご体感いただけます。
    tags: ["断熱", "省エネ", "ZEH", "温度"]
    priority: 8
    category: "performance"
    enabled: true
    
  補助金:
    content: |
      住宅購入時の補助金・支援制度についてご案内いたします。

      **主な国の補助金制度**

      **1. ZEH補助金**
      ・対象：ゼロエネルギーハウス（ZEH）
      ・補助額：定額55万円～（条件により異なる）
      ・加算：蓄電池設置で最大20万円追加

      **2. こどもエコすまい支援事業**
      ・対象：子育て世帯・若年夫婦世帯
      ・補助額：最大100万円
      ・省エネ性能に応じて補助額変動

      **3. 住宅ローン減税**
      ・所得税の控除制度（年間最大35万円）
      ・控除期間：13年間（認定住宅等）
      ・住民税からも一部控除可能

      **地方自治体の補助金**
      ・市町村独自の住宅取得支援制度
      ・移住・定住促進補助金
      ・多子世帯向け支援制度

      ※制度は年度ごとに変更される可能性があります。
      最新情報については、弊社スタッフまでお問い合わせください。
    tags: ["補助金", "支援制度", "税制", "ZEH"]
    priority: 7
    category: "financial"
    enabled: true

# LINE用テンプレート（リッチメニュー指定文面のみ有効）
line:
  # 🔧 友だち追加時の歓迎メッセージ（指定文面）
  follow_welcome:
    content: |
      こんにちは！キノエデザインです。
      この度は友だち追加ありがとうございます✨
      目的のボタンをタップ👇
      🤖AI相談 / 📍来場予約 / 📄資料請求 / 💰資金計画 / 🌐サイト / 💬チャット
      AIは24時間、担当者は当日〜翌営業日に返信します。
      ※ご使用の前に、必ず以下の取り扱いをご確認ください。
      プライバシーポリシー：【https://preview.studio.site/live/EjOQljz1WJ/privacy-policy 】
      利用規約：【https://preview.studio.site/live/EjOQljz1WJ/termsofuse/service 】
      Cookie：【https://preview.studio.site/live/EjOQljz1WJ/cookie 】
    tags: ["welcome", "follow", "友だち追加"]
    priority: 10
    category: "service"
    enabled: true
    
  # 🔧 AI相談ボタン押下時の応答（指定文面）
  AI相談:
    content: |
      🤖 AI住まい相談を開始します！
      キノエデザインの住まいAIコンシェルジュです。
      住まいに関するご質問をお気軽にどうぞ！
      💡 **例えば**
      ・坪単価について教えて
      ・標準仕様はどんな感じ？
      ・耐震性能について知りたい
      ・断熱性能はどのくらい？
      何でもお聞きください😊
      ※ご使用の前に、必ず以下の取り扱いをご確認ください。
      プライバシーポリシー：【https://preview.studio.site/live/EjOQljz1WJ/privacy-policy 】
      利用規約：【https://preview.studio.site/live/EjOQljz1WJ/termsofuse/service 】
      Cookie：【https://preview.studio.site/live/EjOQljz1WJ/cookie 】
    tags: ["AI相談", "案内", "開始"]
    priority: 10
    category: "service"
    enabled: true
    
  # 🔧 AI住まいサイトボタン押下時の応答（指定文面）
  AI住まいサイト:
    content: |
      🌐 AI住まいサイトのご案内
      キノエデザインの住まい情報サイトをご紹介します。（家づくりの疑問にAIが24時間即回答）
      🏠 サイト内容：
      ・AIチャット相談（資金計画／補助金／間取り など）
      ・施工写真（実例）
      ・間取りの考え方・プラン例
      ・よくある質問（最初に迷う3つのこと ほか）
      ・保存版デジタル冊子 ZINE（無料ダウンロード）
      ・LINEで無料相談／来場予約
      📱 サイトURL:
      https://preview.studio.site/live/EjOQljz1WJ/
    tags: ["AI住まいサイト", "サイト案内", "URL"]
    priority: 9
    category: "service"
    enabled: true
    
  # 🔧 資料請求ボタン押下時の応答（指定文面）
  資料請求:
    content: |
      📋ありがとうございます！こちらからご覧いただけます。
      〔資料タイトル〕（PDF）：〔URL〕
      よろしければ簡単アンケート（任意）：
      ・ご計画時期：今すぐ / 3–6か月 / 1年以内 / 未定
      ・連絡方法（任意）：このLINE / メール / 連絡不要
      ※必ず以下の取り扱いをご確認ください。
      プライバシーポリシー：【https://preview.studio.site/live/EjOQljz1WJ/privacy-policy 】
      利用規約：【https://preview.studio.site/live/EjOQljz1WJ/termsofuse/service 】
      Cookie：【https://preview.studio.site/live/EjOQljz1WJ/cookie 】
    tags: ["資料請求", "案内", "送付"]
    priority: 9
    category: "service"
    enabled: true
    
  # 🔧 展示場来場予約ボタン押下時の応答（指定文面）
  展示場来場　予約:
    content: |
      📍 展示場のご来場予約につきましては、下記URLより必要事項のご入力をお願い申し上げます。
      【https://preview.studio.studio.site/live/EjOQljz1WJ/reservation 】
      スタッフ一同、心よりお待ちしております！
    tags: ["展示場", "来場予約", "予約", "URL"]
    priority: 8
    category: "service"
    enabled: true
    
  # 🔧 資金計画ボタン押下時の応答（指定文面）
  資金計画:
    content: |
      💬 AI資金診断のご案内
      本診断は匿名でご利用いただけます。ご回答内容は保存いたしません。算出される金額は試算（概算）であり、目安としてご確認ください。
      お手数ですが、以下の5点をご入力ください。
      ・年収（概算可）
      ・毎月のご希望返済額
      ・住宅ローンのご希望借入期間
      ・ご家族構成（例：大人2名・お子さま1名）
      ・その他の大きなご負担（例：自動車ローン 等）
      未入力の項目があっても進められます。ご入力後、概算結果をご提示いたします。
    tags: ["資金計画", "資金診断", "相談", "予算"]
    priority: 9
    category: "financial"
    enabled: true
    
  # 🔧 チャット相談ボタン押下時の応答（指定文面）
  チャット相談:
    content: |
      💬 スタッフとのご相談
      【対応時間】
      営業時間：9:00-18:00
      📱 ご相談方法：
      ・このLINEでの直接相談
      ・お電話での相談
      ・展示場での対面相談
      営業時間内でしたら迅速にお返事します。
      お気軽にお声かけください！
    tags: ["チャット相談", "スタッフ相談", "対応時間", "相談"]
    priority: 6
    category: "service"
    enabled: true

