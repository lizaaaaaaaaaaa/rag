# cloudbuild.yaml - RAG統合版CI/CDパイプライン
# 現在の設定 + cloudbuild-enhanced.yamlの機能を段階的に統合


steps:
  # ========== Phase 1: 基本機能強化 ==========
 
  # 1. 依存関係のキャッシュとインストール（新機能）
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
          python -m pytest tests/ --tb=short || echo "Tests completed with warnings"
        else
          echo "No requirements.txt found, skipping tests"
        fi
    id: 'test-and-validate'


  # 2. 超高速APIサーバー用イメージビルド（既存設定を強化）
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '--build-arg', 'ULTRA_FAST_MODE=true',
      '--build-arg', 'ANTI_HALLUCINATION_MODE=true',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest',
      '-f', 'Dockerfile.api',
      '.'
    ]
    timeout: '900s'
    id: 'build-enhanced-api'
    waitFor: ['test-and-validate']


  # 3. APIサーバーイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest'
    ]
    timeout: '600s'
    id: 'push-enhanced-api'
    waitFor: ['build-enhanced-api']


  # 4. 超高性能APIサーバーをCloud Runにデプロイ（大幅強化）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-api
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=8Gi
      - --cpu=4                           # 2→4に強化
      - --timeout=300s                    # 600s→300sに短縮
      - --min-instances=3                 # 2→3に強化
      - --max-instances=20                # 15→20に強化
      - --concurrency=1000                # 200→1000に大幅強化
      - --port=8080
      - --set-env-vars=ULTRA_FAST_MODE=true,ANTI_HALLUCINATION_MODE=true,ENABLE_AUTO_UPDATE=true,MAX_NEW_TOKENS=150,DB_HOST=127.0.0.1,DB_PORT=5432,GCS_BUCKET_NAME=run-sources-rag-cloud-project-asia-northeast1,ENV=production,OPENAI_MODEL_NAME=gpt-3.5-turbo,OPENAI_TEMPERATURE=0.1,FRONTEND_URL=https://rag-frontend-190389115361.asia-northeast1.run.app,RAG_SEARCH_K=2,RAG_CHUNK_SIZE=300,RAG_TIMEOUT=2,LINE_RESPONSE_TIMEOUT=3,WEB_SEARCH_TIMEOUT=3,ENABLE_RESPONSE_CACHE=true,CACHE_SIZE=500,CACHE_TTL=3600,CONFIDENCE_THRESHOLD=0.7
      - --set-secrets=DB_NAME=db-name:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,GOOGLE_SEARCH_ENGINE_ID=GOOGLE_SEARCH_ENGINE_ID:latest,LINE_CHANNEL_ID=LINE_CHANNEL_ID:latest,LINE_CHANNEL_ACCESS_TOKEN=LINE_CHANNEL_ACCESS_TOKEN:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,LINE_LOGIN_CHANNEL_ID=LINE_LOGIN_CHANNEL_ID:latest,LINE_LOGIN_CHANNEL_SECRET=LINE_LOGIN_CHANNEL_SECRET:latest,LINE_LOGIN_REDIRECT_URI=LINE_LOGIN_REDIRECT_URI:latest,LIFF_ID=LIFF_ID:latest,JWT_SECRET=JWT_SECRET:latest
      - --service-account=190389115361-compute@developer.gserviceaccount.com
      - --vpc-egress=all-traffic
    timeout: '1200s'
    id: 'deploy-enhanced-api'
    waitFor: ['push-enhanced-api']


  # 5. 高速化対応フロントエンドビルド（既存設定を強化）
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '--build-arg', 'API_URL=https://rag-api-190389115361.asia-northeast1.run.app',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest',
      '-f', 'Dockerfile.front',
      '.'
    ]
    timeout: '900s'
    id: 'build-enhanced-frontend'


  # 6. フロントエンドイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest'
    ]
    timeout: '600s'
    id: 'push-enhanced-frontend'
    waitFor: ['build-enhanced-frontend']


  # 7. 高速化対応フロントエンドをCloud Runにデプロイ（強化）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-frontend
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=180s                    # 300s→180sに短縮
      - --min-instances=1                 # 0→1に強化
      - --max-instances=10
      - --concurrency=200                 # 80→200に強化
      - --port=8080
      - --set-env-vars=API_URL=https://rag-api-190389115361.asia-northeast1.run.app,ENABLE_PERFORMANCE_MONITORING=true
      - --set-secrets=DB_PASSWORD=db-password:latest
    timeout: '1200s'
    id: 'deploy-enhanced-frontend'
    waitFor: ['push-enhanced-frontend', 'deploy-enhanced-api']


  # ========== Phase 2: 自動化機能（条件付き有効化） ==========
 
  # 8. 自動更新Cloud Functionをデプロイ（オプション機能）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # AUTO_UPDATE_ENABLEDが設定されている場合のみ実行
        if [ "${_ENABLE_AUTO_UPDATE}" = "true" ]; then
          echo "Deploying auto-update function..."
          if [ -d "cloud_functions" ]; then
            gcloud functions deploy auto-update-function \
              --gen2 \
              --runtime=python311 \
              --region=asia-northeast1 \
              --source=cloud_functions/ \
              --entry-point=scheduled_update \
              --memory=2GB \
              --timeout=540s \
              --max-instances=5 \
              --set-env-vars=GOOGLE_CLOUD_PROJECT=rag-cloud-project,GCS_BUCKET_NAME=run-sources-rag-cloud-project-asia-northeast1,ENABLE_AUTO_UPDATE=true \
              --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,GOOGLE_SEARCH_ENGINE_ID=GOOGLE_SEARCH_ENGINE_ID:latest \
              --trigger-topic=update-trigger
          else
            echo "cloud_functions directory not found, skipping function deployment"
          fi
        else
          echo "Auto-update function deployment skipped (set _ENABLE_AUTO_UPDATE=true to enable)"
        fi
    timeout: '900s'
    id: 'deploy-auto-update-function'
    waitFor: ['deploy-enhanced-frontend']


  # ========== Phase 3: インフラ構築（条件付き有効化） ==========


  # 9. 必要なPub/Subトピックを作成（オプション）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENABLE_AUTO_UPDATE}" = "true" ]; then
          echo "Setting up Pub/Sub infrastructure..."
          # トピックの存在確認と作成
          gcloud pubsub topics describe update-trigger || \
          gcloud pubsub topics create update-trigger


          # サブスクリプションの作成
          gcloud pubsub subscriptions describe update-subscription || \
          gcloud pubsub subscriptions create update-subscription \
            --topic=update-trigger \
            --ack-deadline=600
        else
          echo "Pub/Sub setup skipped (set _ENABLE_AUTO_UPDATE=true to enable)"
        fi
    id: 'setup-pubsub'
    waitFor: ['deploy-auto-update-function']


  # 10. Cloud Schedulerジョブを作成/更新（オプション）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENABLE_AUTO_UPDATE}" = "true" ]; then
          echo "Setting up scheduled updates..."
          # 既存のスケジューラーがあれば削除
          gcloud scheduler jobs delete weekly-update --quiet || echo "No existing weekly job to delete"
          gcloud scheduler jobs delete monthly-update --quiet || echo "No existing monthly job to delete"
         
          # 新しいスケジューラーを作成
          gcloud scheduler jobs create pubsub weekly-update \
            --schedule="0 2 * * 1" \
            --topic=update-trigger \
            --message-body='{"type": "weekly_update", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' \
            --time-zone="Asia/Tokyo" \
            --description="RAG自動更新（毎週月曜日午前2時）"
         
          # 月次更新スケジューラーも作成
          gcloud scheduler jobs create pubsub monthly-update \
            --schedule="0 3 1 * *" \
            --topic=update-trigger \
            --message-body='{"type": "monthly_update", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' \
            --time-zone="Asia/Tokyo" \
            --description="RAG詳細更新（毎月1日午前3時）"
        else
          echo "Scheduler setup skipped (set _ENABLE_AUTO_UPDATE=true to enable)"
        fi
    id: 'setup-scheduler'
    waitFor: ['setup-pubsub']


  # 11. Firestore インデックス設定（オプション）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENABLE_AUTO_UPDATE}" = "true" ]; then
          echo "Setting up Firestore..."
          # Firestoreデータベースの存在確認と作成
          gcloud firestore databases describe --format="value(name)" || \
          gcloud firestore databases create --region=asia-northeast1


          # インデックス設定ファイルがある場合はデプロイ
          if [ -f "firestore.indexes.json" ]; then
            gcloud firestore indexes composite create --collection-group=update_logs --field-config field-path=timestamp,order=descending --field-config field-path=source_id,order=ascending || echo "Index may already exist"
          fi
        else
          echo "Firestore setup skipped (set _ENABLE_AUTO_UPDATE=true to enable)"
        fi
    id: 'setup-firestore'
    waitFor: ['setup-scheduler']


images:
  - 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest'
  - 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest'


# 高性能ビルドマシン設定
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
  env:
    - 'ULTRA_FAST_BUILD=true'
    - 'CLOUDBUILD_ENHANCED=true'


# 拡張可能な置換変数
substitutions:
  _ENABLE_AUTO_UPDATE: 'false'    # 自動更新機能の有効化フラグ
  _ENV: 'production'              # 環境設定
  _DEBUG_MODE: 'false'            # デバッグモード


timeout: '3600s'