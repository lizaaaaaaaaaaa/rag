# cloudbuild.yaml — Build → Push → Deploy → Env 追加入れ替え → 確認
# Artifact Registry / Cloud Run を使った標準的なパイプラインです。

timeout: "1200s"
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # ====== 変更ポイント（必要に応じて上書きできます）======
  _REGION: "asia-northeast1"
  _SERVICE: "rag-api"
  # Artifact Registry のホスト／リポジトリ
  _AR_HOST: "asia-northeast1-docker.pkg.dev"
  _AR_REPO: "rag-api"
  # イメージタグ（デフォルトはコミットハッシュ）
  _IMAGE_TAG: "$SHORT_SHA"

steps:
  # 1) Build
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build"
    args:
      [
        "build",
        "-t",
        "${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}",
        ".",
      ]

  # 2) Push
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push"
    args:
      [
        "push",
        "${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}",
      ]

  # 3) Deploy（既存の Cloud Run サービス rag-api に新しいイメージを適用）
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-deploy"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE}",
        "--image",
        "${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--project",
        "$PROJECT_ID",
        "--quiet",
      ]

  # 4) 追加：RAG 初期化を無効化（超高速起動用）
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "set-disable-rag-init"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "Updating Cloud Run env: DISABLE_RAG_INIT=true"
        gcloud run services update "${_SERVICE}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --set-env-vars="DISABLE_RAG_INIT=true"

  # 5) 確認：環境変数を出力（name / value を一覧表示）
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "describe-env"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "Describing Cloud Run service env vars..."
        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format='table(spec.template.spec.containers[0].env[].name, spec.template.spec.containers[0].env[].value)'

images:
  - "${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}"
