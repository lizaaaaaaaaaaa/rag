steps:
  # 1. APIサーバー用イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest',
      '-f', 'Dockerfile.api',
      '.'
    ]
    timeout: '900s'

  # 2. APIサーバーイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest'
    ]
    timeout: '600s'

  # 3. APIサーバーをCloud Runにデプロイ（軽量化）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-api
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=16Gi
      - --cpu=4
      - --timeout=600s
      - --min-instances=1
      - --max-instances=10
      - --concurrency=80
      - --port=8080
      - --set-env-vars=MODEL_PRESET=auto,MAX_NEW_TOKENS=512,DB_HOST=127.0.0.1,DB_PORT=5432,GCS_BUCKET_NAME=run-sources-rag-cloud-project-asia-northeast1,ENV=production,OPENAI_MODEL_NAME=gpt-3.5-turbo,REDIS_URL=redis://your-redis-instance,LANGCHAIN_TRACING_V2=false,LANGCHAIN_PROJECT=default,DISABLE_LANGSMITH=true,OPENAI_TEMPERATURE=0.3,FRONTEND_URL=https://rag-frontend-190389115361.asia-northeast1.run.app
      - --set-secrets=DB_NAME=db-name:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,GOOGLE_SEARCH_ENGINE_ID=GOOGLE_SEARCH_ENGINE_ID:latest,LINE_CHANNEL_ACCESS_TOKEN=LINE_CHANNEL_ACCESS_TOKEN:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,LINE_LOGIN_CHANNEL_ID=LINE_LOGIN_CHANNEL_ID:latest,LINE_LOGIN_CHANNEL_SECRET=LINE_LOGIN_CHANNEL_SECRET:latest,LINE_LOGIN_REDIRECT_URI=LINE_LOGIN_REDIRECT_URI:latest,LIFF_ID=LIFF_ID:latest,JWT_SECRET=JWT_SECRET:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest
      - --service-account=190389115361-compute@developer.gserviceaccount.com
      - --vpc-egress=private-ranges-only
    timeout: '1200s'

  # 4. フロントエンド用イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest',
      '-f', 'Dockerfile.front',
      '.'
    ]
    timeout: '900s'

  # 5. フロントエンドイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest'
    ]
    timeout: '600s'

  # 6. フロントエンドをCloud Runにデプロイ（軽量化）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-frontend
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=300s
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --port=8080
      - --set-env-vars=API_URL=https://rag-api-190389115361.asia-northeast1.run.app,DB_HOST=127.0.0.1,DB_PORT=5432,DB_USER=raguser,DB_NAME=rag_db
      - --set-secrets=DB_PASSWORD=db-password:latest
    timeout: '1200s'

images:
  - 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest'
  - 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  # 修正: substitution_option → substitutionOption
  substitutionOption: 'ALLOW_LOOSE'

timeout: '3600s'