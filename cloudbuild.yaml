# cloudbuild.yaml - 安全なビルド成功版(スタートアップタイムアウト対策)

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE

timeout: '3600s'

steps:
  # 1. 依存関係のキャッシュとインストール
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
          python -m pytest tests/ --tb=short || echo "Tests completed with warnings"
        else
          echo "No requirements.txt found, skipping tests"
        fi
    id: 'test-and-validate'
    timeout: '600s'

  # 2. 高速APIサーバー用イメージビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '--build-arg', 'ULTRA_FAST_MODE=true',
      '--build-arg', 'ANTI_HALLUCINATION_MODE=true',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest',
      '-f', 'Dockerfile.api',
      '.'
    ]
    timeout: '1500s'
    id: 'build-enhanced-api'
    waitFor: ['test-and-validate']

  # 3. APIサーバーイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest'
    ]
    timeout: '1800s'
    id: 'push-enhanced-api'
    waitFor: ['build-enhanced-api']

  # 4. 修正版APIサーバーをCloud Runにデプロイ(不足フラグを追加)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-api
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=16Gi
      - --cpu=6
      - --timeout=600s
      - --min-instances=1
      - --max-instances=20
      - --concurrency=80
      - --port=8080
      - --cpu-boost
      # ===== ここを修正(コールドスタート/ネットワーク対策) =====
      - --no-cpu-throttling
      - --execution-environment=gen2
      - --vpc-connector=projects/rag-cloud-project/locations/asia-northeast1/connectors/run-connector
      - --vpc-egress=all-traffic
      # ===== 非機密の環境変数(据え置き＋維持) =====
      - "--set-env-vars=DISABLE_RAG_INIT=true,STARTUP_TIMEOUT=300,HEALTH_CHECK_TIMEOUT=60,OPENAI_MAX_TOKENS=900,LLM_TIMEOUT=45,RATE_LIMIT_PER_MINUTE=600,CONSENT_VALIDITY_MONTHS=12,WORM_RETENTION_YEARS=5,PRIVACY_POLICY_URL=https://rag-api-190389115361.asia-northeast1.run.app/privacy,CONSENT_MIDDLEWARE=true,ENABLE_RAG=true,RAG_IMPL=FAST,INCLUDE_SOURCES=true,USE_HYBRID_SEARCH=true,ENABLE_RERANKING=true,GCS_VECTOR_PREFIX=rag/vectorstore/,VECTORSTORE_PATH=/workspace/rag/vectorstore,RAG_ENABLED=true"
      - '--set-env-vars=^~^GCS_UPLOADS_PREFIXES=uploads/,uploads/admin/'
      - "--set-env-vars=ULTRA_FAST_MODE=true,ANTI_HALLUCINATION_MODE=true,ENABLE_AUTO_UPDATE=true,MAX_NEW_TOKENS=150,DB_HOST=127.0.0.1,DB_PORT=5432,GCS_BUCKET_NAME=run-sources-rag-cloud-project-asia-northeast1,GCS_CONSENT_BUCKET=consent-logs-rag-cloud-project-asia-northeast1,ENV=production,OPENAI_MODEL_NAME=gpt-3.5-turbo,OPENAI_TEMPERATURE=0.1,FRONTEND_URL=https://rag-frontend-190389115361.asia-northeast1.run.app,RAG_SEARCH_K=2,RAG_CHUNK_SIZE=300,RAG_TIMEOUT=2,LINE_RESPONSE_TIMEOUT=3,WEB_SEARCH_TIMEOUT=3,ENABLE_RESPONSE_CACHE=true,CACHE_SIZE=500,CACHE_TTL=3600,CONFIDENCE_THRESHOLD=0.7,PUBLIC_FRONT_BASE=https://rag-frontend-jy2dt7mlwq-an.a.run.app,PUBLIC_API_BASE=https://rag-api-jy2dt7mlwq-an.a.run.app,PUBLIC_BASE_URL=https://rag-api-190389115361.asia-northeast1.run.app,CONSENT_ENFORCE=true,POLICY_VERSION=2025-08-17"

      # ▼▼▼ ここが今回の追加：RAG厳格モードを本番に反映 ▼▼▼
      - "--set-env-vars=STRICT_RAG_ONLY=true,STRICT_GROUNDED_ANSWERING=true,REQUIRE_CITATIONS=false,LOCATION_INTENT_STRICT=true,ENABLE_WEB_SEARCH=false"
      # ▲▲▲ 追加ここまで ▲▲▲

      # ===== 機密は Secret Manager から(LIFF_ID_FINANCIAL を修正) =====
      - --set-secrets=DB_NAME=db-name:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,GOOGLE_SEARCH_ENGINE_ID=GOOGLE_SEARCH_ENGINE_ID:latest,LINE_CHANNEL_ID=LINE_CHANNEL_ID:latest,LINE_CHANNEL_ACCESS_TOKEN=LINE_CHANNEL_ACCESS_TOKEN:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,LINE_LOGIN_CHANNEL_ID=LINE_LOGIN_CHANNEL_ID:latest,LINE_LOGIN_CHANNEL_SECRET=LINE_LOGIN_CHANNEL_SECRET:latest,LINE_LOGIN_REDIRECT_URI=LINE_LOGIN_REDIRECT_URI:latest,LIFF_ID=LIFF_ID:latest,JWT_SECRET=JWT_SECRET:latest,LIFF_ID_FINANCIAL=LIFF_ID_FINANCIAL:latest,LIFF_CONSENT_URL=LIFF_CONSENT_URL:latest,LINE_BASIC_ID=LINE_BASIC_ID:latest,OPS_ADMIN_SECRET=OPS_ADMIN_SECRET:latest

      # ★ ALLOWED_ORIGINS - 修正版（ダブルクォートで値全体を囲む）
      - '--set-env-vars=ALLOWED_ORIGINS="https://rag-frontend-jy2dt7mlwq-an.a.run.app,https://leafy-kitsune-eb4566.netlify.app,https://ai.kinoedesign.co.jp,https://liff.line.me"'
      - --service-account=190389115361-compute@developer.gserviceaccount.com
    timeout: '1800s'
    id: 'deploy-enhanced-api'
    waitFor: ['push-enhanced-api']

  # 5. フロントエンドビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '--build-arg', 'API_URL=https://rag-api-190389115361.asia-northeast1.run.app',
      '-t', 'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest',
      '-f', 'Dockerfile.front',
      '.'
    ]
    timeout: '1800s'
    id: 'build-enhanced-frontend'
    waitFor: ['deploy-enhanced-api']

  # 6. フロントエンドイメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest'
    ]
    timeout: '1200s'
    id: 'push-enhanced-frontend'
    waitFor: ['build-enhanced-frontend']

  # 7. フロントエンドをCloud Runにデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-frontend
      - --image=asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-frontend:latest
      - --region=asia-northeast1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      - --timeout=300s
      - --min-instances=0
      - --max-instances=10
      - --concurrency=500
      - --port=8080
      - "--set-env-vars=API_URL=https://rag-api-190389115361.asia-northeast1.run.app,ENV=production,USERS_DB_PATH=/tmp/users.db,ADMIN_PASSWORD=adminpass"
      - --service-account=190389115361-compute@developer.gserviceaccount.com
    timeout: '600s'
    id: 'deploy-enhanced-frontend'
    waitFor: ['push-enhanced-frontend']

  # 8. デプロイ確認(安全版 + RAGプリウォームを追加)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== デプロイ完了確認(安全版) ==="
        echo "API URL: https://rag-api-190389115361.asia-northeast1.run.app"
        echo "Frontend URL: https://rag-frontend-190389115361.asia-northeast1.run.app"
        echo "デプロイ時刻: $(date)"

        # APIの起動を待つ(120秒 - 安全な時間)
        echo "⏳ APIの起動を待機中(120秒)..."
        sleep 120

        # 追加：RAGプリウォーム(初回5分問題対策)
        echo "🔥 Pre-warm RAG chain..."
        (curl -fsS --max-time 30 "https://rag-api-190389115361.asia-northeast1.run.app/debug/fix-rag" || true)

        # ヘルスチェック(リトライ機能付き)
        for i in {1..15}; do
          echo "🔍 API Health Check... (${i}/15)"
          if curl -f --max-time 30 "https://rag-api-190389115361.asia-northeast1.run.app/healthz" 2>/dev/null; then
            echo "✅ API Health Check OK"

            echo "🔍 System Status Check..."
            if curl -f --max-time 30 "https://rag-api-190389115361.asia-northeast1.run.app/system-status" 2>/dev/null; then
              echo "✅ System Status OK"
            else
              echo "⚠️ System status endpoint might need more time"
            fi

            echo "🔍 LINE Bot Debug Check..."
            if curl -f --max-time 30 "https://rag-api-190389115361.asia-northeast1.run.app/line-debug" 2>/dev/null; then
              echo "✅ LINE Bot Debug OK"
            else
              echo "⚠️ LINE Bot debug endpoint might need more time"
            fi
            break
          else
            echo "⏳ API starting... waiting 20s more"
            sleep 20
          fi
        done

        echo "🚀 デプロイが完了しました！"
        echo "📍 重要なエンドポイント:"
        echo "  - Health: https://rag-api-190389115361.asia-northeast1.run.app/healthz"
        echo "  - Chat: https://rag-api-190389115361.asia-northeast1.run.app/chat"
        echo "  - System Status: https://rag-api-190389115361.asia-northeast1.run.app/system-status"
        echo "  - LINE Debug: https://rag-api-190389115361.asia-northeast1.run.app/line-debug"
        echo "  - LINE Debug Ultimate: https://rag-api-190389115361.asia-northeast1.run.app/line/debug-ultimate"
    timeout: '600s'
    id: 'deployment-verification'
    waitFor: ['deploy-enhanced-frontend']

serviceAccount: 'projects/rag-cloud-project/serviceAccounts/190389115361-compute@developer.gserviceaccount.com'

substitutions:
  _PROJECT_ID: 'rag-cloud-project'
  _REGION: 'asia-northeast1'
  _REGISTRY: 'asia-northeast1-docker.pkg.dev'
  _REPOSITORY: 'rag-chat-pro'