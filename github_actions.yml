# github_actions.yml
# GitHub Actions CI/CD設定

name: Deploy RAG API with Financial Planning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: rag-cloud-project
  SERVICE_NAME: rag-api
  REGION: asia-northeast1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run basic tests
      run: |
        python -c "
        from api.routers.line_bot_financial_planner import FinancialPlanningHandler
        handler = FinancialPlanningHandler()
        print('✅ 資金計画ハンドラーテスト成功')
        "

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ env.PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true
    
    - name: Build and Deploy
      run: |
        # イメージビルド
        gcloud builds submit --tag gcr.io/$PROJECT_ID/$SERVICE_NAME:financial
        
        # Cloud Run デプロイ
        gcloud run deploy $SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/$SERVICE_NAME:financial \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars LINE_BOT_MODE=ultra_fast_financial,ENABLE_FINANCIAL_PLANNING=true
    
    - name: Health Check
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format="value(status.url)")
        curl -f "$SERVICE_URL/healthz"