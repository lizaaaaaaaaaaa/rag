<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI住まい相談 - RAG対応版</title>
    <style>
        body {
            background: #e5edf5;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
            display: flex;
            /* ▼ 追記: フッターを下に配置しやすくするため縦並びに */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #10c041;
            color: #fff;
            padding: 20px 16px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            position: relative;
        }
        .rag-indicator {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 8px;
        }
        .platform-indicator {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            background: rgba(255,255,255,0.15);
            padding: 1px 4px;
            border-radius: 4px;
        }
        .chat-messages {
            flex: 1;
            padding: 18px 12px;
            background: #e5edf5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .welcome-message {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            padding: 20px;
            margin: auto 0;
        }
        .message {
            display: flex;
            align-items: flex-end;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.ai {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
            background: #10c041;
            color: #fff;
            border-bottom-right-radius: 4px;
            position: relative;
        }
        .message.user .message-content {
            background: #10c041;
            color: #fff;
            border-bottom-right-radius: 4px;
            border-bottom-left-radius: 16px;
        }
        .message.ai .message-content {
            background: #fff;
            color: #222;
            border: 1px solid #d2e7d9;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 16px;
        }
        .response-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            text-align: right;
        }
        .rag-source { border-left: 3px solid #4caf50; }
        .search-verified { border-left: 3px solid #2196f3; }
        .chatgpt-source { border-left: 3px solid #ff9800; }
        .template-source { border-left: 3px solid #9c27b0; }
        .confidence-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 4px;
        }
        .confidence-high { background-color: #4caf50; }
        .confidence-medium { background-color: #ff9800; }
        .confidence-low { background-color: #f44336; }
        .chat-input-container {
            background: #fafbfc;
            padding: 12px;
            border-top: 1px solid #e0e0e0;
        }
        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 14px;
            border: 1.5px solid #c6e2d7;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
            resize: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .chat-input:focus { border-color: #10c041; }
        .send-button {
            width: 44px;
            height: 44px;
            background: #10c041;
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .send-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing-indicator {
            margin: 0 0 8px 8px;
            color: #666;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b6dab9;
            margin-right: 2px;
            animation: typing 1.2s infinite;
        }
        .dot:nth-child(2) {animation-delay: 0.2s;}
        .dot:nth-child(3) {animation-delay: 0.4s;}
        @keyframes typing {
            0%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
        }
        .error-message {
            background: #fff2f2;
            color: #d32f2f;
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid #d32f2f;
            margin: 6px 0;
            font-size: 0.92rem;
        }

        /* ▼ 追記: フッター用の軽いスタイル */
        footer {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #3a3a3a;
        }
        footer a { color: #2f6db0; text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        /* モバイルレスポンシブ */
        @media (max-width: 480px) {
            .chat-container { height: 100vh; max-width: 100vw; border-radius: 0;}
            .chat-header { padding: 14px 4px; font-size: 1.05rem;}
            .chat-messages { padding: 8px 2px;}
        }
    </style>

    <!-- ▼▼▼ 追記: GA4（IDを差し替え） ▼▼▼ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXX'); // ←あなたの GA4 ID

      const p = new URLSearchParams(location.search);
      const ab = p.get('ab') || 'A';
      const state = p.get('state') || 'rag_home';
      const utm_campaign = p.get('utm_campaign') || 'unknown';
      gtag('event', 'liff_open', {ab, state, utm_campaign});
      // 例: RAG の質問時に以下を送る（必要時のみ）
      // gtag('event','rag_ask',{ab, state, utm_campaign});
    </script>
    <!-- ▲▲▲ 追記ここまで ▲▲▲ -->

</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            AI住まい相談
            <span class="platform-indicator">Web</span>
            <span class="rag-indicator">🧠RAG対応</span>

            <!-- ▼ 追記: βラベル（ヘッダー内に1行） -->
            <div aria-label="beta" style="font-size:.8rem;opacity:.7;margin-top:6px;">β版</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message" id="welcomeMessage">
                <strong>🏠 AI住まい相談へようこそ！</strong><br><br>
                住宅に関するご質問をお気軽にどうぞ。<br>
                社内資料とWeb検索を活用して、正確な情報をお答えします。<br><br>
                <small>例：坪単価について教えて、耐震性能はどのくらい？など</small>
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display:none;">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span>資料を検索中...</span>
        </div>
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="chatInput" placeholder="住宅についてお聞きください..." rows="1"></textarea>
                <button class="send-button" id="sendButton" type="button">➤</button>
            </div>
        </div>
    </div>

    <!-- ▼ 追記: フッター常設リンク -->
    <footer>
      <a href="/privacy">Privacy</a> |
      <a href="/terms">Terms</a> |
      <a href="/cookie">Cookie</a>
    </footer>

    <script>
        class RAGEnabledChatUI {
            constructor() {
                // RAG対応エンドポイント
                this.API_URL = 'https://rag-api-190389115361.asia-northeast1.run.app/chat';
                this.PLATFORM = 'web';

                this.chatMessages = document.getElementById('chatMessages');
                this.chatInput = document.getElementById('chatInput');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.welcomeMessage = document.getElementById('welcomeMessage');

                this.initializeEventListeners();
                this.adjustTextareaHeight();
                
                // RAGパフォーマンス監視
                this.responseMetrics = [];
                this.ragEnabled = true;
                this.hasFirstMessage = false;
            }

            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.chatInput.addEventListener('input', () => this.adjustTextareaHeight());
            }

            adjustTextareaHeight() {
                this.chatInput.style.height = 'auto';
                this.chatInput.style.height = Math.min(this.chatInput.scrollHeight, 120) + 'px';
            }

            async sendMessage() {
                const message = this.chatInput.value.trim();
                if (!message) return;
                
                // 初回メッセージ時にウェルカムメッセージを削除
                if (!this.hasFirstMessage && this.welcomeMessage) {
                    this.welcomeMessage.remove();
                    this.hasFirstMessage = true;
                }
                
                this.addUserMessage(message);
                this.chatInput.value = '';
                this.adjustTextareaHeight();
                this.setLoading(true);
                this.updateTypingText("資料を検索中...");

                const startTime = performance.now();

                try {
                    const response = await this.callRAGAPI(message);
                    const responseTime = performance.now() - startTime;
                    
                    this.recordPerformance(responseTime, response);
                    this.addAIMessage(response.answer, response, responseTime);
                    
                } catch (error) {
                    console.error('RAG API Error:', error);
                    this.showError('エラーが発生しました。時間を置いて再度お試しください。');
                } finally {
                    this.setLoading(false);
                }
            }

            async callRAGAPI(question) {
                /**
                 * RAG対応API呼び出し
                 */
                try {
                    const response = await fetch(this.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            question, 
                            username: `web-user-${Date.now()}`,
                            platform: 'web'
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    return {
                        answer: data.answer || 'すみません、回答できませんでした。',
                        source: data.performance?.source || 'unknown',
                        platform: data.performance?.platform || 'web',
                        processing_time: data.performance?.processing_time || 0,
                        confidence: data.performance?.confidence || 0.8,
                        search_used: data.performance?.search_used || false,
                        source_docs_count: data.performance?.source_docs_count || 0
                    };
                    
                } catch (error) {
                    console.error('RAG API call failed:', error);
                    throw error;
                }
            }

            recordPerformance(responseTime, response) {
                this.responseMetrics.push({
                    timestamp: Date.now(),
                    responseTime,
                    source: response.source,
                    confidence: response.confidence,
                    searchUsed: response.search_used
                });
                
                // 長時間応答の監視
                if (responseTime > 10000) {
                    console.warn('Very slow RAG response:', responseTime + 'ms');
                }
                
                // メトリクス履歴のクリーンアップ
                if (this.responseMetrics.length > 100) {
                    this.responseMetrics = this.responseMetrics.slice(-50);
                }
            }

            addUserMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                messageDiv.innerHTML = `<div class="message-content">${this.escapeHtml(message)}</div>`;
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            addAIMessage(message, metadata = {}, responseTime = 0) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ai';
                
                // ソース別のスタイリング
                const sourceClass = this.getSourceClass(metadata.source);
                const confidenceClass = this.getConfidenceClass(metadata.confidence || 0.8);
                
                // 信頼性指標
                const confidenceIndicator = `<span class="confidence-indicator ${confidenceClass}"></span>`;
                
                // 応答情報（デバッグモード時のみ表示）
                const showDebug = window.location.search.includes('debug=true');
                const responseInfo = showDebug && responseTime > 0 ? 
                    `<div class="response-info">
                        ${this.getSourceIcon(metadata.source)} ${responseTime.toFixed(0)}ms | 
                        信頼度: ${(metadata.confidence * 100).toFixed(0)}% ${confidenceIndicator} |
                        検索: ${metadata.search_used ? '✓' : '✗'} |
                        文書: ${metadata.source_docs_count || 0}件
                     </div>` : '';
                
                messageDiv.innerHTML = `
                    <div class="message-content ${sourceClass}">
                        ${this.formatMessage(message)}
                        ${responseInfo}
                    </div>
                `;
                
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            getSourceClass(source) {
                switch(source) {
                    case 'rag_verified': return 'search-verified';
                    case 'rag': return 'rag-source';
                    case 'chatgpt': return 'chatgpt-source';
                    case 'template': return 'template-source';
                    default: return '';
                }
            }

            getConfidenceClass(confidence) {
                if (confidence >= 0.8) return 'confidence-high';
                if (confidence >= 0.6) return 'confidence-medium';
                return 'confidence-low';
            }

            getSourceIcon(source) {
                switch(source) {
                    case 'rag_verified': return '🔍✓';
                    case 'rag': return '📚';
                    case 'chatgpt': return '🤖';
                    case 'template': return '📋';
                    case 'cache': return '⚡';
                    default: return '🔄';
                }
            }

            formatMessage(message) {
                return this.escapeHtml(message).replace(/\n/g, '<br>');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            setLoading(isLoading) {
                this.sendButton.disabled = isLoading;
                this.chatInput.disabled = isLoading;
                this.typingIndicator.style.display = isLoading ? 'flex' : 'none';
                if (isLoading) this.scrollToBottom();
            }

            updateTypingText(text) {
                const typingText = this.typingIndicator.querySelector('span:last-child');
                if (typingText) {
                    typingText.textContent = text;
                }
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                this.chatMessages.appendChild(errorDiv);
                this.scrollToBottom();
                setTimeout(() => errorDiv.remove(), 5000);
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            // RAGパフォーマンス統計表示（デバッグ用）
            showRAGPerformanceStats() {
                if (this.responseMetrics.length === 0) return;
                
                const avgResponseTime = this.responseMetrics.reduce((sum, m) => sum + m.responseTime, 0) / this.responseMetrics.length;
                const ragResponses = this.responseMetrics.filter(m => m.source === 'rag' || m.source === 'rag_verified').length;
                const searchUsedCount = this.responseMetrics.filter(m => m.searchUsed).length;
                const avgConfidence = this.responseMetrics.reduce((sum, m) => sum + m.confidence, 0) / this.responseMetrics.length;
                
                console.log(`RAG Performance Stats:
                - Platform: Web (RAG Enabled)
                - Average Response Time: ${avgResponseTime.toFixed(0)}ms
                - RAG Responses: ${ragResponses}/${this.responseMetrics.length}
                - Search Verifications: ${searchUsedCount}/${this.responseMetrics.length}
                - Average Confidence: ${(avgConfidence * 100).toFixed(1)}%
                - Total Queries: ${this.responseMetrics.length}`);
            }
        }

        // グローバルインスタンス
        let chatUI;
        
        document.addEventListener('DOMContentLoaded', () => {
            chatUI = new RAGEnabledChatUI();
            
            // パフォーマンス統計の定期表示（開発時のみ）
            if (window.location.hostname === 'localhost' || window.location.search.includes('debug=true')) {
                setInterval(() => chatUI.showRAGPerformanceStats(), 30000);
                console.log('🧠 RAG Enabled Chat UI initialized');
            }
        });
    </script>
</body>
</html>
