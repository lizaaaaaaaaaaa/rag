<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI住まい相談 - Web版</title>
    <style>
        body {
            background: #e5edf5;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 640px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #10c041;
            color: #fff;
            padding: 20px 16px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            position: relative;
        }
        .speed-indicator {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 8px;
        }
        .platform-indicator {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            background: rgba(255,255,255,0.15);
            padding: 1px 4px;
            border-radius: 4px;
        }
        .chat-messages {
            flex: 1;
            padding: 18px 12px;
            background: #e5edf5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .welcome-message {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            padding: 20px;
            margin: auto 0;
        }
        .message {
            display: flex;
            align-items: flex-end;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.ai {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
            background: #10c041;
            color: #fff;
            border-bottom-right-radius: 4px;
            position: relative;
        }
        .message.user .message-content {
            background: #10c041;
            color: #fff;
            border-bottom-right-radius: 4px;
            border-bottom-left-radius: 16px;
        }
        .message.ai .message-content {
            background: #fff;
            color: #222;
            border: 1px solid #d2e7d9;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 16px;
        }
        .response-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            text-align: right;
        }
        .quick-reply-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .quick-reply-btn {
            background: #f0f7f2;
            border: 1px solid #10c041;
            color: #10c041;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-reply-btn:hover {
            background: #10c041;
            color: #fff;
        }
        .chat-input-container {
            background: #fafbfc;
            padding: 12px;
            border-top: 1px solid #e0e0e0;
        }
        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 14px;
            border: 1.5px solid #c6e2d7;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
            resize: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: #10c041;
        }
        .send-button {
            width: 44px;
            height: 44px;
            background: #10c041;
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .typing-indicator {
            margin: 0 0 8px 8px;
            color: #666;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b6dab9;
            margin-right: 2px;
            animation: typing 1.2s infinite;
        }
        .dot:nth-child(2) {animation-delay: 0.2s;}
        .dot:nth-child(3) {animation-delay: 0.4s;}
        @keyframes typing {
            0%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
        }
        .error-message {
            background: #fff2f2;
            color: #d32f2f;
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid #d32f2f;
            margin: 6px 0;
            font-size: 0.92rem;
        }
        .fast-response {
            border-left: 3px solid #4caf50;
        }
        .web-optimized {
            border-left: 3px solid #2196f3;
        }
        /* モバイルレスポンシブ */
        @media (max-width: 480px) {
            .chat-container { height: 100vh; max-width: 100vw; border-radius: 0;}
            .chat-header { padding: 14px 4px; font-size: 1.05rem;}
            .chat-messages { padding: 8px 2px;}
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            AI住まい相談
            <span class="platform-indicator">Web</span>
            <span class="speed-indicator">⚡超高速</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <!-- 初期メッセージはシンプルな案内のみ -->
            <div class="welcome-message" id="welcomeMessage">
                家づくりについて何でもお聞きください。<br>
                お気軽にご質問をどうぞ。
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display:none;">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span>考え中...</span>
        </div>
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="chatInput" placeholder="メッセージを入力..." rows="1"></textarea>
                <button class="send-button" id="sendButton" type="button">➤</button>
            </div>
        </div>
    </div>
    <script>
        class WebOptimizedChatUI {
            constructor() {
                // Web専用エンドポイント（プラットフォーム分離対応）
                this.API_URL = 'https://rag-api-190389115361.asia-northeast1.run.app/chat';
                this.PLATFORM = 'web';

                this.chatMessages = document.getElementById('chatMessages');
                this.chatInput = document.getElementById('chatInput');
                this.sendButton = document.getElementById('sendButton');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.welcomeMessage = document.getElementById('welcomeMessage');

                this.initializeEventListeners();
                this.adjustTextareaHeight();
                // 初期挨拶は表示しない（ユーザーの質問に即座に応答するため）
                // this.showInitialGreeting(); // 削除
                
                // パフォーマンス監視（Web専用）
                this.responseMetrics = [];
                this.webOptimizedMode = true;
                this.hasFirstMessage = false;
            }

            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.chatInput.addEventListener('input', () => this.adjustTextareaHeight());
            }

            adjustTextareaHeight() {
                this.chatInput.style.height = 'auto';
                this.chatInput.style.height = Math.min(this.chatInput.scrollHeight, 120) + 'px';
            }

            async sendMessage() {
                const message = this.chatInput.value.trim();
                if (!message) return;
                
                // 初回メッセージ時にウェルカムメッセージを削除
                if (!this.hasFirstMessage && this.welcomeMessage) {
                    this.welcomeMessage.remove();
                    this.hasFirstMessage = true;
                }
                
                this.addUserMessage(message);
                this.chatInput.value = '';
                this.adjustTextareaHeight();
                this.setLoading(true);

                const startTime = performance.now();

                try {
                    const response = await this.callWebOptimizedAPI(message);
                    const responseTime = performance.now() - startTime;
                    
                    this.recordPerformance(responseTime, response.platform, response.source);
                    this.addAIMessage(response.answer, response, responseTime);
                    
                } catch (error) {
                    console.error('Web API Error:', error);
                    this.showError('エラーが発生しました。時間を置いて再度お試しください。');
                } finally {
                    this.setLoading(false);
                }
            }

            async callWebOptimizedAPI(question) {
                /**
                 * Web専用API呼び出し（プラットフォーム分離対応）
                 */
                try {
                    const response = await fetch(this.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            question, 
                            username: `web-user-${Date.now()}`,
                            platform: 'web'  // プラットフォーム明示
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    return {
                        answer: data.answer || 'すみません、回答できませんでした。',
                        source: data.performance?.source || 'unknown',
                        platform: data.performance?.platform || 'web',
                        processing_time: data.performance?.processing_time || 0,
                        template_based: data.performance?.template_based || false,
                        rag_enabled: data.performance?.rag_enabled || false
                    };
                    
                } catch (error) {
                    console.error('Web API call failed:', error);
                    
                    // フォールバック：ローカル応答（Web専用）
                    return this.getWebLocalResponse(question);
                }
            }

            getWebLocalResponse(question) {
                /**
                 * Web専用ローカル応答（プラットフォーム分離対応）
                 */
                const q = question.toLowerCase();
                
                if (q.includes('坪単価') || q.includes('価格') || q.includes('費用')) {
                    return {
                        answer: '坪単価についてご案内いたします。標準仕様では約70〜85万円/坪が目安となります。詳細なお見積りをご提供いたしますので、お気軽にお問い合わせください。',
                        source: 'web_local_template',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                } else if (q.includes('仕様') || q.includes('設備')) {
                    return {
                        answer: '標準仕様についてご説明いたします。耐震等級3の長期優良住宅を基準とし、高品質な住まいをご提供しております。詳細は展示場でご確認いただけます。',
                        source: 'web_local_template',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                } else if (q.includes('断熱') || q.includes('性能')) {
                    return {
                        answer: '断熱性能については、高品質な断熱材を使用し、快適な住環境を実現しています。ZEH基準に対応した省エネ性能で、一年中快適にお過ごしいただけます。',
                        source: 'web_local_template',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                } else if (q.includes('補助金') || q.includes('助成金')) {
                    return {
                        answer: '住宅購入時の補助金制度についてご案内します。ZEH補助金、こどもエコすまい支援事業、住宅ローン減税など様々な制度があります。制度は年度により変更されますので、最新情報はスタッフまでお問い合わせください。',
                        source: 'web_local_template',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                } else if (q.includes('資料') || q.includes('パンフレット')) {
                    return {
                        answer: '資料請求を承ります。お名前、ご住所、お電話番号をお教えいただければ、詳しい資料をお送りいたします。3営業日以内にお送りいたします。',
                        source: 'web_local_template',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                } else {
                    return {
                        answer: 'お尋ねの内容について詳しくご案内いたします。住宅に関することでしたら何でもお気軽にお問い合わせください。',
                        source: 'web_local_fallback',
                        platform: 'web',
                        processing_time: 0,
                        template_based: true
                    };
                }
            }

            recordPerformance(responseTime, platform, source) {
                this.responseMetrics.push({
                    timestamp: Date.now(),
                    responseTime,
                    platform,
                    source
                });
                
                // 遅い応答の監視
                if (responseTime > 3000) {
                    console.warn('Slow response detected:', responseTime + 'ms');
                }
                
                // メトリクス履歴のクリーンアップ
                if (this.responseMetrics.length > 100) {
                    this.responseMetrics = this.responseMetrics.slice(-50);
                }
            }

            addUserMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                messageDiv.innerHTML = `<div class="message-content">${this.escapeHtml(message)}</div>`;
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            addAIMessage(message, metadata = {}, responseTime = 0) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ai';
                
                const isFast = responseTime < 1000;
                const isWebOptimized = metadata.platform === 'web';
                const fastClass = isFast ? 'fast-response' : '';
                const webClass = isWebOptimized ? 'web-optimized' : '';
                
                const responseInfo = responseTime > 0 ? 
                    `<div class="response-info">
                        ${responseTime < 1000 ? '⚡' : '🔄'} ${responseTime.toFixed(0)}ms | 
                        ${metadata.platform || 'web'} | ${metadata.source || 'unknown'}
                     </div>` : '';
                
                messageDiv.innerHTML = `
                    <div class="message-content ${fastClass} ${webClass}">
                        ${this.formatMessage(message)}
                        ${responseInfo}
                    </div>
                `;
                
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }

            formatMessage(message) {
                return this.escapeHtml(message).replace(/\n/g, '<br>');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            setLoading(isLoading) {
                this.sendButton.disabled = isLoading;
                this.chatInput.disabled = isLoading;
                this.typingIndicator.style.display = isLoading ? 'flex' : 'none';
                if (isLoading) this.scrollToBottom();
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                this.chatMessages.appendChild(errorDiv);
                this.scrollToBottom();
                setTimeout(() => errorDiv.remove(), 4000);
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            // パフォーマンス統計表示（デバッグ用）
            showPerformanceStats() {
                if (this.responseMetrics.length === 0) return;
                
                const avgResponseTime = this.responseMetrics.reduce((sum, m) => sum + m.responseTime, 0) / this.responseMetrics.length;
                const fastResponses = this.responseMetrics.filter(m => m.responseTime < 1000).length;
                const fastPercentage = (fastResponses / this.responseMetrics.length * 100).toFixed(1);
                const webPlatformRequests = this.responseMetrics.filter(m => m.platform === 'web').length;
                
                console.log(`Web Performance Stats:
                - Platform: Web (${webPlatformRequests}/${this.responseMetrics.length} requests)
                - Average Response Time: ${avgResponseTime.toFixed(0)}ms
                - Fast Responses (<1s): ${fastPercentage}%
                - Total Queries: ${this.responseMetrics.length}
                - Web Optimized Mode: ${this.webOptimizedMode}`);
            }
        }

        // グローバルインスタンス
        let chatUI;
        
        document.addEventListener('DOMContentLoaded', () => {
            chatUI = new WebOptimizedChatUI();
            
            // パフォーマンス統計の定期表示（開発時のみ）
            if (window.location.hostname === 'localhost' || window.location.search.includes('debug=true')) {
                setInterval(() => chatUI.showPerformanceStats(), 30000);
                console.log('🌐 Web Optimized Chat UI initialized with platform separation');
            }
        });
    </script>
</body>
</html>
