<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI住まい相談 - Webチャット</title>

  <!-- rag-api を固定（別オリジンでも確実に動かす） -->
  <script>window.__API_BASE='https://rag-api-190389115361.asia-northeast1.run.app';</script>

  <style>
    body{background:#e5edf5;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;font-family:system-ui,"Hiragino Sans","Meiryo",sans-serif}
    .chat-container{width:100%;max-width:420px;height:640px;background:#fff;border-radius:20px;box-shadow:0 4px 32px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden;margin:24px 0}
    .chat-header{background:#10c041;color:#fff;padding:18px 16px;font-size:1.1rem;font-weight:700;text-align:center;letter-spacing:2px;position:relative}
    .chat-messages{flex:1;padding:14px 10px;background:#e5edf5;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
    .welcome-message{color:#666;font-size:.95rem;padding:20px;text-align:center;margin:auto 0}
    .message{display:flex}.message.user{justify-content:flex-end}.message.ai{justify-content:flex-start}
    .message-content{max-width:70%;padding:12px 16px;border-radius:16px;line-height:1.5}
    .message.user .message-content{background:#10c041;color:#fff;border-bottom-right-radius:4px}
    .message.ai .message-content{background:#fff;color:#222;border:1px solid #d2e7d9;border-bottom-left-radius:4px}
    .chat-input-container{background:#fafbfc;padding:12px;border-top:1px solid #e0e0e0}
    .chat-input-wrapper{display:flex;gap:8px;align-items:flex-end}
    .chat-input{flex:1;min-height:40px;max-height:120px;padding:10px 14px;border:1.5px solid #c6e2d7;border-radius:24px;outline:0;resize:none}
    .send-button{width:44px;height:44px;background:#10c041;border:0;border-radius:50%;color:#fff;font-size:1.3rem}
    .send-button:disabled,.chat-input:disabled{opacity:.55;cursor:not-allowed}
    .error-message{background:#fff2f2;color:#d32f2f;padding:10px 14px;border-left:4px solid #d32f2f;border-radius:10px}
    /* モーダル（最優先に重ねる） */
    #consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2147483647}
    #consent-card{max-width:720px;width:92%;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:20px}
    #consent-card h3{margin:0 0 10px}
    #consent-card ul{margin:8px 0 14px 1.1em}
    #consent-card li{margin:8px 0}
    #consent-go{width:100%;padding:12px 16px;border-radius:12px;border:0;background:#0a7cff;color:#fff;font-weight:600}
    #consent-go:disabled{background:#aac8f5}
    /* チャット内フォールバック */
    .consent-inline{background:#fff;border:1px solid #d2e7d9;border-radius:12px;padding:12px}
    .consent-inline h4{margin:0 0 8px;font-size:1rem}
    .consent-inline ul{margin:6px 0 8px 1.1em}
    .consent-inline button{padding:8px 12px;border-radius:10px;border:0;background:#0a7cff;color:#fff}
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">AI住まい相談</div>
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-message" id="welcomeMessage">
        <strong>🏠 ようこそ！</strong><br>はじめにご同意が必要です。画面の案内に従ってください。
      </div>
    </div>
    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <textarea class="chat-input" id="chatInput" placeholder="同意が必要です" rows="1" disabled></textarea>
        <button class="send-button" id="sendButton" type="button" disabled>➤</button>
      </div>
    </div>
  </div>

  <!-- 同意モーダル（まずはこれを表示。見えなければフォールバックに切替） -->
  <div id="consent-overlay">
    <div id="consent-card" role="dialog" aria-modal="true">
      <h3>AIチャットのご利用前にご確認ください</h3>
      <p>以下の<strong>5項目</strong>すべてに同意が必要です。</p>
      <ul>
        <li><label><input type="checkbox" id="c_pp"> プライバシーポリシーに同意します</label></li>
        <li><label><input type="checkbox" id="c_tos"> 利用規約に同意します</label></li>
        <li><label><input type="checkbox" id="c_cookie"> Cookie・類似技術の利用に同意します</label></li>
        <li><label><input type="checkbox" id="c_xfer"> 入力内容が外部送信される可能性に同意します</label></li>
        <li><label><input type="checkbox" id="c_ai"> 生成AIの誤答可能性を理解しました</label></li>
      </ul>
      <p>
        <a href="/privacy" target="_blank">プライバシーポリシー</a> /
        <a href="/terms" target="_blank">利用規約</a> /
        <a href="/cookie" target="_blank">Cookie・外部送信</a>
      </p>
      <button id="consent-go" disabled>同意して始める</button>
      <div id="consent-msg" style="color:#666;margin-top:6px;min-height:1.2em"></div>
    </div>
  </div>

  <script>
    /************** 共通ユーティリティ **************/
    const API_BASE = window.__API_BASE || location.origin;
    const POLICY_VERSION="2025-09-01";
    const TOS_VERSION   ="2025-09-01";
    const $ = (s)=>document.querySelector(s);

    function uuid4(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));}
    function getWebUid(){try{let id=localStorage.getItem("web_uid");if(!id){id="web-"+uuid4();localStorage.setItem("web_uid",id)}return id}catch(_){return "web-"+Math.random().toString(36).slice(2)}}
    const WEB_UID=getWebUid(); localStorage.setItem('user_id',WEB_UID);

    async function consentCheck(){
      const r = await fetch(`${API_BASE}/consent/check`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({user_id:WEB_UID,policy_version:POLICY_VERSION,tos_version:TOS_VERSION})
      }).catch(()=>null);
      if(!r) return false;
      try{const j=await r.json();return !!j.valid}catch(_){return false}
    }
    async function consentSave(flags){
      const payload={consent_id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
        user_id:WEB_UID,consented_at:new Date().toISOString(),
        policy_version:POLICY_VERSION,tos_version:TOS_VERSION,
        flags,source:"web",ua:navigator.userAgent,locale:navigator.language||"ja-JP",withdrawn:false};
      const r = await fetch(`${API_BASE}/consent/save`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok) throw new Error("save failed"); const j=await r.json(); if(!j.success) throw new Error("save failed"); return j;
    }
    function setChatEnabled(b){
      const input=$("#chatInput"), send=$("#sendButton");
      input.disabled=!b; send.disabled=!b;
      input.placeholder= b ? "住宅についてお聞きください…" : "同意が必要です";
    }

    /************** チャット本体 **************/
    class ChatUI{
      constructor(){
        this.API_URL=`${API_BASE}/chat`;
        this.chatMessages=$("#chatMessages");
        this.chatInput=$("#chatInput"); this.sendButton=$("#sendButton");
        this.bind();
      }
      bind(){
        this.sendButton.addEventListener('click',()=>this.send());
        this.chatInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.send();}});
      }
      addUser(text){const d=document.createElement('div');d.className='message user';d.innerHTML=`<div class="message-content">${this.escape(text)}</div>`;this.chatMessages.appendChild(d);this.scroll()}
      addAI(text){const d=document.createElement('div');d.className='message ai';d.innerHTML=`<div class="message-content">${this.escape(text).replace(/\n/g,'<br>')}</div>`;this.chatMessages.appendChild(d);this.scroll()}
      escape(t){const x=document.createElement('div');x.textContent=t;return x.innerHTML}
      scroll(){this.chatMessages.scrollTop=this.chatMessages.scrollHeight}
      async send(){
        const q=this.chatInput.value.trim(); if(!q||this.chatInput.disabled) return;
        this.addUser(q); this.chatInput.value='';
        try{
          const r=await fetch(this.API_URL,{
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "X-User-Id": WEB_UID  // ★ 同意ゲート通過のため必須
            },
            body:JSON.stringify({question:q,username:WEB_UID,platform:"web"})
          });
          if(r.status===403){
            // 未同意など → フォールバックの同意ボックスを表示
            injectInlineConsent();
            this.addAI("ご利用前に同意が必要です。表示されたボックスで同意してください。");
            return;
          }
          const j=await r.json(); this.addAI(j.answer||'すみません、回答できませんでした。');
        }catch(e){
          this.addAI('エラーが発生しました。時間を置いて再度お試しください。');
        }
      }
    }
    let chatUI;

    /************** 同意 UI（モーダル + フォールバック） **************/
    function boxesOK(){return ["#c_pp","#c_tos","#c_cookie","#c_xfer","#c_ai"].every(s=>$(s)?.checked)}
    function enableGo(){ $("#consent-go").disabled = !boxesOK(); }
    ["#c_pp","#c_tos","#c_cookie","#c_xfer","#c_ai"].forEach(s=>$(s)?.addEventListener('change',enableGo));

    async function startIfConsented(){
      const ok = await consentCheck();
      if(ok){ $("#consent-overlay").style.display='none'; setChatEnabled(true); return true; }
      return false;
    }

    function injectInlineConsent(){
      // 既に注入済みなら何もしない
      if(document.getElementById('consent-inline')) return;

      const wrap=document.createElement('div');
      wrap.id='consent-inline'; wrap.className='consent-inline';
      wrap.innerHTML = `
        <h4>ご利用前に同意が必要です</h4>
        <ul>
          <li><label><input type="checkbox" id="ic_pp"> プライバシーポリシーに同意します</label></li>
          <li><label><input type="checkbox" id="ic_tos"> 利用規約に同意します</label></li>
          <li><label><input type="checkbox" id="ic_cookie"> Cookie・類似技術の利用に同意します</label></li>
          <li><label><input type="checkbox" id="ic_xfer"> 入力内容が外部送信される可能性に同意します</label></li>
          <li><label><input type="checkbox" id="ic_ai"> 生成AIの誤答可能性を理解しました</label></li>
        </ul>
        <div style="margin:6px 0">
          <a href="/privacy" target="_blank">プライバシーポリシー</a> /
          <a href="/terms" target="_blank">利用規約</a> /
          <a href="/cookie" target="_blank">Cookie・外部送信</a>
        </div>
        <button id="ic_go" disabled>同意して開始</button>
        <div id="ic_msg" style="color:#666;margin-top:4px;min-height:1.1em"></div>
      `;
      $("#chatMessages").prepend(wrap);

      const chk=()=>{const ok=["#ic_pp","#ic_tos","#ic_cookie","#ic_xfer","#ic_ai"].every(s=>$(s)?.checked); $("#ic_go").disabled=!ok;}
      ["#ic_pp","#ic_tos","#ic_cookie","#ic_xfer","#ic_ai"].forEach(s=>$(s)?.addEventListener('change',chk)); chk();

      $("#ic_go").addEventListener('click',async()=>{
        $("#ic_go").disabled=true; $("#ic_msg").textContent="保存中…";
        try{
          await consentSave({pp:$("#ic_pp").checked,tos:$("#ic_tos").checked,cookie:$("#ic_cookie").checked,xfer:$("#ic_xfer").checked,ai_limits:$("#ic_ai").checked});
          wrap.remove(); setChatEnabled(true);
        }catch(e){$("#ic_msg").textContent="保存に失敗しました。時間をおいて再度お試しください。"; $("#ic_go").disabled=false;}
      });
    }

    async function boot(){
      chatUI=new ChatUI();
      setChatEnabled(false);

      // 1) 事前チェックで同意済みなら即解放
      if(await startIfConsented()){ setChatEnabled(true); return; }

      // 2) モーダルの「同意して始める」
      $("#consent-go").addEventListener('click',async()=>{
        $("#consent-go").disabled=true; $("#consent-msg").textContent="保存中…";
        try{
          await consentSave({pp:$("#c_pp").checked,tos:$("#c_tos").checked,cookie:$("#c_cookie").checked,xfer:$("#c_xfer").checked,ai_limits:$("#c_ai").checked});
          $("#consent-overlay").style.display='none'; setChatEnabled(true); $("#consent-msg").textContent="";
        }catch(e){ $("#consent-msg").textContent="保存に失敗しました。"; $("#consent-go").disabled=false; }
      });
      enableGo();

      // 3) もし2秒待ってもモーダルが見えない（CSSに潰される等）ならチャット内フォールバックを注入
      setTimeout(()=>{
        const ov = $("#consent-overlay");
        const visible = ov && window.getComputedStyle(ov).display !== 'none' && ov.offsetParent !== null;
        if(!visible){ injectInlineConsent(); }
      }, 2000);
    }
    document.addEventListener('DOMContentLoaded',boot);
  </script>
</body>
</html>
