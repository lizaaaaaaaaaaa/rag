spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '25'
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 530.0.0
        run.googleapis.com/startup-cpu-boost: 'true'
        # === 変更: VPC コネクタを run-connector に、egress を all に寄せる ===
        run.googleapis.com/vpc-access-connector: projects/rag-cloud-project/locations/asia-northeast1/connectors/run-connector
        run.googleapis.com/vpc-access-egress: all
        # === 追加: CPUスロットリング無効 / Gen2 実行環境明示 ===
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/execution-environment: gen2
      labels:
        client.knative.dev/nonce: qkynzipqpk
        commit-sha: 0a7376b8052f93868d12d843c8bfcb8f6206c092
        gcb-build-id: d5efd2e0-7319-4ee2-8ae3-6b9dacd415c9
        gcb-commit-sha: d358a2cb8e6cdbc204a2d3c163166a1c971e4b7c
        gcb-trigger-id: cfcf322a-a08a-48ee-8b47-9f721c40a245
        gcb-trigger-region: global
        image-tag: d358a2c
        managed-by: gcp-cloud-build-deploy-cloud-run
        run.googleapis.com/startupProbeType: Custom
    spec:
      containerConcurrency: 100
      timeoutSeconds: 600
      serviceAccountName: 190389115361-compute@developer.gserviceaccount.com
      # vpcAccess ブロック側も run-connector / all にそろえる
      vpcAccess:
        connector: projects/rag-cloud-project/locations/asia-northeast1/connectors/run-connector
        egress: all
      containers:
      - name: rag-api-1
        image: asia-northeast1-docker.pkg.dev/rag-cloud-project/rag-chat-pro/rag-api:v1.0.100
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '8'
            memory: 32Gi
        env:
          # 既存（維持）
          - name: MODEL_PRESET
            value: auto
          - name: MAX_NEW_TOKENS
            value: '256'
          - name: DB_HOST
            value: 127.0.0.1
          - name: DB_PORT
            value: '5432'
          - name: GCS_BUCKET_NAME
            value: run-sources-rag-cloud-project-asia-northeast1
          - name: ENV
            value: production
          - name: OPENAI_MODEL_NAME
            value: gpt-3.5-turbo
          - name: REDIS_URL
            value: redis://your-redis-instance
          - name: LANGCHAIN_TRACING_V2
            value: 'true'
          - name: LANGCHAIN_PROJECT
            value: rag-chat-evaluation

          # 追加：非機密の運用パラメータ（Cloud Build と合わせる）
          - name: OPENAI_TEMPERATURE
            value: '0.1'
          - name: FRONTEND_URL
            value: https://rag-frontend-190389115361.asia-northeast1.run.app
          - name: RAG_SEARCH_K
            value: '2'
          - name: RAG_CHUNK_SIZE
            value: '300'
          - name: RAG_TIMEOUT
            value: '2'
          - name: LINE_RESPONSE_TIMEOUT
            value: '3'
          - name: WEB_SEARCH_TIMEOUT
            value: '3'
          - name: ENABLE_RESPONSE_CACHE
            value: 'true'
          - name: CACHE_SIZE
            value: '500'
          - name: CACHE_TTL
            value: '3600'
          - name: CONFIDENCE_THRESHOLD
            value: '0.7'
          - name: DISABLE_RAG_INIT
            value: 'true'
          - name: STARTUP_TIMEOUT
            value: '300'
          - name: HEALTH_CHECK_TIMEOUT
            value: '60'
          - name: ULTRA_FAST_MODE
            value: 'true'
          - name: ANTI_HALLUCINATION_MODE
            value: 'true'
          - name: ENABLE_AUTO_UPDATE
            value: 'true'

          # 既存の Secret（維持）
          - name: DB_NAME
            valueFrom: { secretKeyRef: { name: db-name, key: latest } }
          - name: DB_USER
            valueFrom: { secretKeyRef: { name: db-user, key: latest } }
          - name: DB_PASSWORD
            valueFrom: { secretKeyRef: { name: db-password, key: latest } }
          - name: OPENAI_API_KEY
            valueFrom: { secretKeyRef: { name: OPENAI_API_KEY, key: latest } }
          - name: GOOGLE_CLIENT_ID
            valueFrom: { secretKeyRef: { name: GOOGLE_CLIENT_ID, key: latest } }
          - name: GOOGLE_CLIENT_SECRET
            valueFrom: { secretKeyRef: { name: GOOGLE_CLIENT_SECRET, key: latest } }
          - name: GOOGLE_REDIRECT_URI
            valueFrom: { secretKeyRef: { name: GOOGLE_REDIRECT_URI, key: latest } }
          - name: GOOGLE_SEARCH_API_KEY
            valueFrom: { secretKeyRef: { name: GOOGLE_SEARCH_API_KEY, key: latest } }
          - name: GOOGLE_SEARCH_ENGINE_ID
            valueFrom: { secretKeyRef: { name: GOOGLE_SEARCH_ENGINE_ID, key: latest } }
          - name: LANGSMITH_API_KEY
            valueFrom: { secretKeyRef: { name: LANGSMITH_API_KEY, key: latest } }

          # 追加：LINE/LIFF/JWT（Cloud Build の set-secrets と同等）
          - name: LINE_CHANNEL_ID
            valueFrom: { secretKeyRef: { name: LINE_CHANNEL_ID, key: latest } }
          - name: LINE_CHANNEL_ACCESS_TOKEN
            valueFrom: { secretKeyRef: { name: LINE_CHANNEL_ACCESS_TOKEN, key: latest } }
          - name: LINE_CHANNEL_SECRET
            valueFrom: { secretKeyRef: { name: LINE_CHANNEL_SECRET, key: latest } }
          - name: LINE_LOGIN_CHANNEL_ID
            valueFrom: { secretKeyRef: { name: LINE_LOGIN_CHANNEL_ID, key: latest } }
          - name: LINE_LOGIN_CHANNEL_SECRET
            valueFrom: { secretKeyRef: { name: LINE_LOGIN_CHANNEL_SECRET, key: latest } }
          - name: LINE_LOGIN_REDIRECT_URI
            valueFrom: { secretKeyRef: { name: LINE_LOGIN_REDIRECT_URI, key: latest } }
          - name: LIFF_ID
            valueFrom: { secretKeyRef: { name: LIFF_ID, key: latest } }
          - name: LIFF_ID_FINANCIAL
            valueFrom: { secretKeyRef: { name: LIFF_ID, key: latest } }
          - name: JWT_SECRET
            valueFrom: { secretKeyRef: { name: JWT_SECRET, key: latest } }

        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 3
        startupProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 5
  traffic:
  - latestRevision: true
    percent: 100