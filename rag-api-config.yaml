# rag-api-config.yaml (API service only; used when _DEPLOY_MODE=yaml)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE__
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: 190389115361-compute@developer.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 30
      vpcAccess:
        connector: projects/__PROJECT_ID__/locations/__REGION__/connectors/run-connector
        egress: all
      containers:
        - image: __IMAGE__
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
          env:
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: INCLUDE_SOURCES
              value: "false"
          # 機密は cloudbuild.yaml の --set-secrets で注入する想定
